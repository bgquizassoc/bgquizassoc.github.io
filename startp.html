<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Старт на Куиз Процент</title>
<style>
  body { background:#001a33; color:white; text-align:center; padding:40px; font-family:Arial; }
  button {
    padding:15px 30px; font-size:1.4em; border:none; border-radius:10px;
    background:#ffd100; color:#111; font-weight:bold; cursor:pointer;
  }
  input, select {
    padding:10px; font-size:1.2em; border-radius:8px; border:none;
    margin-bottom:20px; width:200px; text-align:center;
  }
  .field-row {
    margin: 10px 0;
    font-size: 1.1em;
  }
  .field-row label {
    display: inline-block;
    width: 220px;
    text-align: right;
    margin-right: 10px;
  }
</style>
</head>
<body>
<h1>📈 Старт на Куиз Процент</h1>

<div class="field-row">
  <label>Име на епизод:</label>
  <input id="ep" placeholder="пример: percent01">
</div>

<div class="field-row">
  <label>Час за старт на играта:</label>
  <input type="time" id="startTime">
</div>

<br>
<button id="startBtn">СТАРТ</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, deleteDoc, getDoc
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6ds9mU-xvF1LSvhaeCNtMbROu0k",
  authDomain: "cifromania-ac182.firebaseapp.com",
  projectId: "cifromania-ac182",
  storageBucket: "cifromania-ac182.appspot.com",
  messagingSenderId: "165208255580",
  appId: "1:165208255580:web:b36744f0eb527b6571129"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== РЪЧНО ПРОМЕНЯЕМИ ВРЕМЕНА =====
const LOBBY_TIME    = 10000;  // 10 секунди лоби
const Q             = 20000;  // ⚠️ време за въпрос — ТРЯБВА да остане 20000 (20 сек),
                               // защото бонусът за скорост в percent.html е изчислен точно
                               // за тази скала (1.0 т. на 10-тата сек. → 0.0 на 20-тата сек.).
                               // Ако промениш това число, бонусът за скорост в играта
                               // ще излиза неточен спрямо реално изминалото време.
const JOKER_BUFFER   = 15000;  // ⭐ буфер за жокери Мнозинство/Специалист
const EXPL          = 10000;  // време за обяснение
const Q_RANKING      = 10000;  // ⭐ ново — класиране само по конкретния въпрос
const RANK           = 10000;  // временно / крайно общо класиране

let questions = [];

async function loadQuestions() {
  const res = await fetch("percent/questions.json");
  questions = await res.json();
}

async function setState(ep, index, phase, durationMs) {
  await setDoc(
    doc(db, "games", "percent", "state", "current"),
    {
      episodeId: ep,
      index,
      phase,
      startTime: Date.now(),
      duration: durationMs
    },
    { merge: false }
  );
}

async function resetState() {
  try {
    await deleteDoc(doc(db, "games", "percent", "state", "current"));
  } catch(e) {}
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// ⭐ проверяваме дали НЯКОЙ играч е ползвал Мнозинство/Специалист/Шпионин за този въпрос
async function getJokerUsage(ep, index) {
  try {
    const snap = await getDoc(doc(db, "games", "percent", "episodes", ep, "jokerUsage", String(index)));
    return snap.exists() ? snap.data() : {};
  } catch(e) {
    return {};
  }
}

async function runGame(ep) {
  await loadQuestions();
  const total = questions.length;

  for (let i = 0; i < total; i++) {
    await setState(ep, i, "question", Q);
    await sleep(Q);

    // ⭐ буферната фаза се вкарва САМО ако е реално ползван жокер за този въпрос —
    // иначе минаваме директно към обяснение, без излишно чакане за всички
    const usage = await getJokerUsage(ep, i);
    if (usage.majorityUsed || usage.specialistUsed || usage.spyUsed) {
      await setState(ep, i, "jokerBuffer", JOKER_BUFFER);
      await sleep(JOKER_BUFFER);
    }

    await setState(ep, i, "explanation", EXPL);
    await sleep(EXPL);

    // ⭐ НОВА ФАЗА — класиране само по този въпрос (точки + бонуси + време)
    await setState(ep, i, "qRanking", Q_RANKING);
    await sleep(Q_RANKING);

    await setState(ep, i, "ranking", RANK);
    await sleep(RANK);
  }
}

document.getElementById("startBtn").onclick = async () => {
  const ep = document.getElementById("ep").value.trim();
  const startTimeRaw = document.getElementById("startTime").value;

  if (!ep) return alert("Въведи име на епизод!");
  if (!startTimeRaw) return alert("Избери час за старт!");

  const [hh, mm] = startTimeRaw.split(":").map(Number);
  const now = new Date();
  let startAt = new Date(
    now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0
  ).getTime();

  if (startAt <= Date.now()) {
    startAt += 24 * 60 * 60 * 1000;
  }

  const prestartDuration = startAt - Date.now() - LOBBY_TIME;

  if (prestartDuration < 0) {
    return alert("Избраният час е твърде близо! Избери по-късен час.");
  }

  await resetState();
  await setState(ep, 0, "lobby", LOBBY_TIME);
  setTimeout(() => setState(ep, 0, "prestart", prestartDuration), LOBBY_TIME);
  setTimeout(() => runGame(ep), LOBBY_TIME + prestartDuration);

  const h = Math.floor(prestartDuration / 3600000);
  const m = Math.floor((prestartDuration % 3600000) / 60000);
  alert(`Куиз Процент стартиран! Лоби 10 сек → Престарт ${h > 0 ? h + "ч " : ""}${m}мин → Старт в ${startTimeRaw}`);
};
</script>
</body>
</html>
