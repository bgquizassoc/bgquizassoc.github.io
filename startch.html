<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Старт на Куиз Чифтосване</title>
<style>
  body { background:#001a33; color:white; text-align:center; padding:30px; font-family:Arial; }
  h1 { color:#ffd100; }
  button {
    padding:12px 25px; font-size:1.2em; border:none; border-radius:10px;
    background:#ffd100; color:#111; font-weight:bold; cursor:pointer; margin:5px;
  }
  button:hover { background:#ffcc33; }
  input {
    padding:10px; font-size:1.1em; border-radius:8px; border:none;
    margin-bottom:15px; width:220px; text-align:center;
    background:#002a55; color:white;
  }
  .field-row { margin: 10px 0; font-size: 1.1em; }
  .field-row label { display:inline-block; width:200px; text-align:right; margin-right:10px; }
  .section {
    background:rgba(255,255,255,0.06); border-radius:12px;
    padding:15px; margin:15px auto; max-width:500px; text-align:left;
  }
  .section h3 { color:#ffd100; margin-bottom:10px; text-align:center; }
  #statusMsg { margin-top:15px; color:#00e676; font-size:1.1em; }
  #log {
    margin-top: 20px; text-align: left; max-width: 600px; margin-left: auto; margin-right: auto;
    background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px;
    font-size: 0.9em; line-height: 1.6; max-height: 300px; overflow-y: auto;
  }
</style>
</head>
<body>
<h1>🔗 Старт на Куиз Чифтосване</h1>

<div class="field-row">
  <label>Епизод:</label>
  <input id="ep" placeholder="chift01">
</div>
<div class="field-row">
  <label>Час за старт:</label>
  <input type="time" id="startTime">
</div>

<br>
<button id="startBtn">🚀 СТАРТ</button>
<div id="statusMsg"></div>
<div id="log"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6ds9mU-xvF1LSvhaeCNtMbROu0k",
  authDomain: "cifromania-ac182.firebaseapp.com",
  projectId: "cifromania-ac182",
  storageBucket: "cifromania-ac182.appspot.com",
  messagingSenderId: "165208255580",
  appId: "1:165208255580:web:b36744f0eb527b6571129"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const GAME_ID = "chift";

// ===== РЪЧНО ПРОМЕНЯЕМИ ВРЕМЕНА (в милисекунди) =====
const LOBBY_TIME = 10000;   // 10 сек. лоби
const Q          = 120000;  // 2 мин. за самия кръг (чифтосване)
const RES        = 30000;   // резултати от кръга
const Q_RANKING  = 20000;   // класиране за конкретния кръг
const RANK       = 30000;   // общо класиране

let questions = [];

function log(msg) {
  const el = document.getElementById("log");
  const line = document.createElement("div");
  line.textContent = `[${new Date().toLocaleTimeString('bg-BG')}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
  console.log(msg);
}

function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

async function loadQuestions() {
  const res = await fetch("chift/questions.json");
  if (!res.ok) {
    throw new Error(`questions.json не се зареди (HTTP ${res.status}) — провери дали пътят "chift/questions.json" е верен.`);
  }
  const text = await res.text();
  try {
    questions = JSON.parse(text);
  } catch(e) {
    throw new Error(`questions.json има синтактична грешка в самия JSON: ${e.message}. Провери го в jsonlint.com преди да пуснеш пак.`);
  }
  if (!Array.isArray(questions) || questions.length === 0) {
    throw new Error("questions.json се зареди, но е празен или не е масив от кръгове.");
  }
  log(`Заредени ${questions.length} кръга: ${questions.map(q => q.title).join(", ")}`);
}

async function setState(ep, index, phase, durationMs, extra = {}) {
  await setDoc(
    doc(db, "games", GAME_ID, "state", "current"),
    { episodeId: ep, index, phase, startTime: Date.now(), duration: durationMs, ...extra },
    { merge: false }
  );
}

async function resetState() {
  try { await deleteDoc(doc(db, "games", GAME_ID, "state", "current")); } catch(e) {}
}

async function runGame(ep) {
  for (let i = 0; i < questions.length; i++) {
    log(`Кръг ${i + 1}/${questions.length}: ${questions[i].title}`);

    await setState(ep, i, "question", Q);
    await sleep(Q);

    await setState(ep, i, "results", RES);
    await sleep(RES);

    await setState(ep, i, "q-ranking", Q_RANKING);
    await sleep(Q_RANKING);

    const isFinal = i === questions.length - 1;
    await setState(ep, i, "ranking", RANK, { isFinal });
    await sleep(RANK);
  }

  log("Играта приключи.");
}

document.getElementById("startBtn").onclick = async () => {
  const ep = document.getElementById("ep").value.trim();
  const startTimeRaw = document.getElementById("startTime").value;
  const statusMsg = document.getElementById("statusMsg");
  const startBtn = document.getElementById("startBtn");

  if (!ep) return alert("Въведи епизод!");
  if (!startTimeRaw) return alert("Избери час!");

  const [hh, mm] = startTimeRaw.split(":").map(Number);
  const now = new Date();
  let startAt = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0).getTime();
  if (startAt <= Date.now()) startAt += 24 * 60 * 60 * 1000;

  const prestartDuration = startAt - Date.now() - LOBBY_TIME;
  if (prestartDuration < 0) return alert("Часът е твърде близо!");

  startBtn.disabled = true;
  startBtn.textContent = "Зареждам въпросите…";

  try {
    await loadQuestions();
  } catch(e) {
    alert("⚠️ ГРЕШКА: " + e.message);
    log("⚠️ ГРЕШКА при зареждане: " + e.message);
    startBtn.disabled = false;
    startBtn.textContent = "🚀 СТАРТ";
    return;
  }

  startBtn.textContent = "Играта тече…";

  try {
    await resetState();
    await setState(ep, 0, "lobby", LOBBY_TIME);
    log(`Лоби (10 сек.) → престарт → старт в ${startTimeRaw}`);

    await sleep(LOBBY_TIME);
    await setState(ep, 0, "prestart", prestartDuration);
    await sleep(prestartDuration);

    log("Играта започва!");
    await runGame(ep);

    statusMsg.textContent = `✅ Епизод "${ep}" приключи.`;
  } catch(e) {
    alert("⚠️ ГРЕШКА по време на играта: " + e.message);
    log("⚠️ ГРЕШКА по време на играта: " + e.message);
  }
};
</script>
</body>
</html>
