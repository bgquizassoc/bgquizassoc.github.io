/* ------------------------- Помощни ------------------------- */

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
  ));
}

function normalize(s) { return String(s == null ? "" : s).trim(); }
function normalizeUpper(s) { return normalize(s).toUpperCase(); }

function getFormat() {
  return (episodeConfig && episodeConfig.format) || "mcq";
}

function getPointsMode() {
  return (episodeConfig && (episodeConfig.pointsMode || episodeConfig.scoringMode)) || "by_difficulty";
}

function letterList(q) {
  return [normalizeUpper(q.letter), ...(q.alt_letters || []).map(normalizeUpper)];
}

/* Верният отговор във вид за показване / запис */
function correctDisplay(q) {
  const fmt = getFormat();
  if (fmt === "mcq") return normalize(q.correct);
  if (fmt === "open_first_letter") return letterList(q).join(" / ");
  return String(q.number);
}

/* ------------------------- Точки ------------------------- */

function pointsForBinary(i) {
  if (getPointsMode() === "equal") return 1;
  if (i < 10) return 1;
  if (i < 20) return 2;
  return 3;
}

function calcNumberPoints(diff, q) {
  const r = q.ranges;
  if (diff === 0) return 10;
  if (r && diff <= r.near) return 5;
  if (r && diff <= r.mid) return 3;
  if (r && diff <= r.far) return 1;
  return 0;
}

/* Оценяване на един отговор според формата */
function evaluateAnswer(q, index, answerRaw) {
  const fmt = getFormat();
  const ans = normalize(answerRaw);

  if (fmt === "mcq") {
    const ok = ans !== "" && ans === normalize(q.correct);
    return { isCorrect: ok, points: ok ? pointsForBinary(index) : 0 };
  }

  if (fmt === "open_first_letter") {
    const ok = ans !== "" && letterList(q).includes(ans.toUpperCase());
    return { isCorrect: ok, points: ok ? pointsForBinary(index) : 0 };
  }

  // number
  const correct = Number(q.number);
  const user = Number(ans);
  const diff = (ans === "" || isNaN(user)) ? Infinity : Math.abs(user - correct);
  return { isCorrect: diff === 0, points: calcNumberPoints(diff, q) };
}

/* ⭐ ТАЙМЕР — показва ЧЧ:ММ:СС в престарт, секунди при въпроси */
function formatTime(totalSeconds) {
  if (totalSeconds >= 60) {
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    if (h > 0) {
      return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    } else {
      return `${m}:${String(s).padStart(2, "0")}`;
    }
  }
  return String(totalSeconds);
}

function updateTimer(startTime, duration) {
  const now = Date.now();
  const remaining = Math.max(0, Math.ceil((duration - (now - startTime)) / 1000));
  globalTimer.textContent = formatTime(remaining);

  if (remaining <= 5) globalTimer.classList.add("warning");
  else globalTimer.classList.remove("warning");
}

/* Детеминирано разбъркване */
function seededShuffle(array, seed) {
  let result = array.slice();
  let s = seed;

  for (let i = result.length - 1; i > 0; i--) {
    s = (s * 9301 + 49297) % 233280;
    const j = Math.floor((s / 233280) * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function lockAnswerUI(answerText) {

  if (li) li.classList.add("submitted");

  let msg = answersDiv.querySelector(".saved-msg");
  if (!msg) {
    msg = document.createElement("div");
    msg.className = "saved-msg";
    answersDiv.appendChild(msg);
  }
  msg.textContent = "✔ Отговорът ти е записан";
}

/* Записва отговора във Firestore (общо за всички формати) */
async function submitAnswer(index, q, answerText, startTime) {
  const ans = normalize(answerText);
  const thinkingTime = Date.now() - startTime;
  const result = evaluateAnswer(q, index, ans);

  lockAnswerUI(ans);

  try {
    await setDoc(
      doc(db, "games", "configurator", "episodes", episodeId, "results", player),
      { exists: true },
      { merge: true }
    );

    // ⭐ Без undefined стойности — Firestore ги отхвърля (затова не работеха open/cifromania)
    await setDoc(
      doc(db, "games", "configurator", "episodes", episodeId, "results", player, "answers", String(index)),
      {
        answer: ans,
        correct: correctDisplay(q),
        explanation: q.explanation || "",
        isCorrect: result.isCorrect,
        points: result.points,
        timestamp: Date.now(),
        thinkingTime
      }
    );
  } catch (e) {
    console.error("Грешка при запис на отговора:", e);
    const msg = answersDiv.querySelector(".saved-msg");
    if (msg) {
      msg.style.color = "#ff8080";
      msg.textContent = "❌ Не успях да запиша отговора. Провери връзката.";
    }
  }
}

/* ---------- MCQ ---------- */
function renderMCQ(q, index, startTime) {
  const wrap = document.createElement("div");
  wrap.className = "answers";

  const seed = episodeId.length * 1000 + index;
  const shuffled = seededShuffle(q.answers || [], seed);

  shuffled.forEach(ans => {
    const btn = document.createElement("button");
    btn.textContent = ans;
    btn.onclick = () => {
      btn.classList.add("selected");
      submitAnswer(index, q, ans, startTime);
    };
    wrap.appendChild(btn);
  });

  answersDiv.appendChild(wrap);
}

/* ---------- ПЪРВА БУКВА ---------- */
function renderLetter(q, index, startTime) {
  const wrap = document.createElement("div");
  wrap.id = "letterArea";

  const hint = document.createElement("div");
  hint.textContent = q.hint_text || "Впиши първата буква:";
  wrap.appendChild(hint);

  const input = document.createElement("input");
  input.type = "text";
  input.id = "letterInput";
  input.maxLength = 1;
  input.autocomplete = "off";
  input.oninput = () => { input.value = input.value.slice(0, 1).toUpperCase(); };
  wrap.appendChild(input);

  const submitBtn = document.createElement("button");
  submitBtn.className = "submit-btn";
  submitBtn.textContent = "Изпрати";
  wrap.appendChild(submitBtn);

  function doSubmit() {
    const typed = input.value.trim();
    if (!typed) return;
    submitAnswer(index, q, typed, startTime);
  }

  input.onkeydown = (e) => { if (e.key === "Enter") doSubmit(); };
  submitBtn.onclick = doSubmit;

  // жокер "Втора сричка" — еднократен за цялата игра
  if (q.syllable2) {
    const panel = document.createElement("div");
    panel.className = "jokers-panel";

    const jokerBtn = document.createElement("button");
    jokerBtn.type = "button";
    jokerBtn.className = "joker-btn";
    jokerBtn.textContent = "🔤 Втора сричка";

    const note = document.createElement("div");
    note.id = "jokerNote";

    const state = loadJoker();
    if (state && state.used) {
      jokerBtn.disabled = true;
      // ако страницата е презаредена на същия въпрос — показваме отново подсказката
      if (state.index === index) note.textContent = `🔤 Втора сричка: "${q.syllable2}"`;
    }

    jokerBtn.onclick = () => {
      saveJoker(index);
      jokerBtn.disabled = true;
      note.textContent = `🔤 Втора сричка: "${q.syllable2}"`;
    };

    panel.appendChild(jokerBtn);
    wrap.appendChild(panel);
    wrap.appendChild(note);
  }

  answersDiv.appendChild(wrap);
  input.focus();
}

/* ---------- ЧИСЛО ---------- */
function renderNumber(q, index, startTime) {
  const wrap = document.createElement("div");
  wrap.id = "numberArea";

  const input = document.createElement("input");
  input.type = "number";
  input.id = "numberInput";
  input.placeholder = "Въведи число";
  wrap.appendChild(input);

  const submitBtn = document.createElement("button");
  submitBtn.className = "submit-btn";
  submitBtn.textContent = "Отговори";
  wrap.appendChild(submitBtn);

  function doSubmit() {
    if (input.value === "") return;
    submitAnswer(index, q, input.value, startTime);
  }

  input.onkeydown = (e) => { if (e.key === "Enter") doSubmit(); };
  submitBtn.onclick = doSubmit;

  answersDiv.appendChild(wrap);
  input.focus();
}

/* Ако вече има записан отговор (презареждане на страницата) — не позволяваме втори */
async function lockIfAlreadyAnswered(index) {
  try {
    const snap = await getDoc(
      doc(db, "games", "configurator", "episodes", episodeId, "results", player, "answers", String(index))
    );
    if (snap.exists()) lockAnswerUI(snap.data().answer);
  } catch (e) {
    console.warn("Не мога да проверя дали вече е отговорено:", e);
  }
}

/* ------------------------- Обяснение ------------------------- */

/* Събира отговорите на всички играчи за даден въпрос */
async function fetchAllAnswers(index) {
  const playersSnap = await getDocs(
    collection(db, "games", "configurator", "episodes", episodeId, "results")
  );

  const entries = await Promise.all(playersSnap.docs.map(async playerDoc => {
    const ansDoc = await getDoc(
      doc(db, "games", "configurator", "episodes", episodeId, "results", playerDoc.id, "answers", String(index))
    );
    return ansDoc.exists() ? { name: playerDoc.id, ...ansDoc.data() } : null;
  }));

  return entries.filter(Boolean);
}

async function renderExplanation(index) {
  showOnly(explanationDiv);
  statsBlock.innerHTML = "";
  explanationText.textContent = "";

  answeredList.style.display = "none";
  answeredNames.innerHTML = "";

  const q = questions[index];
  if (!q) return;

  explanationText.textContent = q.explanation || "";

  const fmt = getFormat();
  const all = await fetchAllAnswers(index);
  const mine = all.find(a => a.name === player);
  const total = all.length;
  const pctOf = c => total ? Math.round((c / total) * 100) : 0;

  let html = "";

  if (fmt === "mcq") {
    const correct = normalize(q.correct);
    const counts = {};
    (q.answers || []).forEach(a => counts[normalize(a)] = 0);

    all.forEach(a => {
      const chosen = normalize(a.answer);
      if (counts[chosen] !== undefined) counts[chosen]++;
    });

    const counted = Object.values(counts).reduce((a, b) => a + b, 0);

    (q.answers || []).forEach(a => {
      const key = normalize(a);
      const c = counts[key] || 0;
      const pct = counted ? Math.round((c / counted) * 100) : 0;
      const isCorrect = key === correct;
      const isMine = mine && normalize(mine.answer) === key;

      html += `
        <div class="stat-answer ${isCorrect ? "correct" : ""} ${isMine ? "mine" : ""}">
          ${esc(a)}
          <span class="pct">${pct}%</span>
          ${isCorrect ? " ✔" : ""}
        </div>
      `;
    });
  }

  else if (fmt === "open_first_letter") {
    const correctLetters = letterList(q);
    const counts = {};
    all.forEach(a => {
      const k = normalizeUpper(a.answer);
      if (k) counts[k] = (counts[k] || 0) + 1;
    });

    // верните букви винаги се показват, дори никой да не ги е написал
    correctLetters.forEach(l => { if (counts[l] === undefined) counts[l] = 0; });

    Object.entries(counts)
      .sort((a, b) => b[1] - a[1])
      .forEach(([letter, c]) => {
        const isCorrect = correctLetters.includes(letter);
        const isMine = mine && normalizeUpper(mine.answer) === letter;
        html += `
          <div class="stat-answer ${isCorrect ? "correct" : ""} ${isMine ? "mine" : ""}">
            ${esc(letter)}
            <span class="pct">${pctOf(c)}%</span>
            ${isCorrect ? " ✔" : ""}
          </div>
        `;
      });
  }

  else {
    // number
    const tiers = { 10: 0, 5: 0, 3: 0, 1: 0, 0: 0 };
    all.forEach(a => {
      const { points } = evaluateAnswer(q, index, a.answer);
      tiers[points] = (tiers[points] || 0) + 1;
    });

    html += `
      <div class="stat-answer correct">
        Верен отговор: ${esc(q.number)}
      </div>
    `;

    [[10, "Точен отговор"], [5, "Много близо"], [3, "Близо"], [1, "Малко далеч"], [0, "Далеч / без отговор"]]
      .forEach(([pts, label]) => {
        html += `
          <div class="stat-answer">
            ${label} (${pts} т.)
            <span class="pct">${pctOf(tiers[pts] || 0)}%</span>
          </div>
        `;
      });
  }

  // собственият резултат на играча
  if (mine) {
    const r = evaluateAnswer(q, index, mine.answer);
    html += `
      <div class="my-result">
        Твоят отговор: <b>${esc(mine.answer)}</b> — ${r.points} т. ${r.isCorrect ? "✔" : (fmt === "number" ? "" : "✘")}
      </div>
    `;
  } else {
    html += `<div class="my-result">Не отговори на този въпрос.</div>`;
  }

  if (fmt !== "mcq") {
    html = `<div style="margin-bottom:8px;">Верен отговор: <b>${esc(correctDisplay(q))}</b></div>` + html;
  }

  statsBlock.innerHTML = html;
}

/* ------------------------- Класиране ------------------------- */

async function renderRanking(index) {
  showOnly(rankingDiv);
  rankingList.innerHTML = "";

  const playersSnap = await getDocs(
    collection(db, "games", "configurator", "episodes", episodeId, "results")
  );

  const scores = {};

  for (const playerDoc of playersSnap.docs) {
    const playerName = playerDoc.id;

    const answersSnap = await getDocs(
      collection(db, "games", "configurator", "episodes", episodeId, "results", playerName, "answers")
    );

    let totalPoints = 0;
    let totalTime = 0;

    answersSnap.forEach(ansDoc => {
      const qIndex = Number(ansDoc.id);
      const data = ansDoc.data();
      const q = questions[qIndex];
      if (!q) return;

      totalPoints += evaluateAnswer(q, qIndex, data.answer).points;

      if (typeof data.thinkingTime === "number") {
        totalTime += data.thinkingTime;
      }
    });

    scores[playerName] = { points: totalPoints, time: totalTime };
  }

  const sorted = Object.entries(scores).sort((a, b) => {
    const ap = a[1].points;
    const bp = b[1].points;
    if (bp !== ap) return bp - ap;

    const at = a[1].time;
    const bt = b[1].time;
    if (at !== bt) return at - bt;

    return a[0].localeCompare(b[0], "bg");
  });

  rankingList.innerHTML = sorted
    .map(([name, obj], i) => {
      const pts = obj.points;
      const time = (obj.time / 1000).toFixed(1);
      const isLast = index >= questions.length - 1;

      let cls = "";
      const isMe = name === player;
      let medal = "";

      if (i === 0) { cls = "gold"; medal = "🥇"; }
      else if (i === 1) { cls = "silver"; medal = "🥈"; }
      else if (i === 2) { cls = "bronze"; medal = "🥉"; }

      const timeText = isLast ? ` (време: ${time} сек)` : "";

      return `<div class="rank-item ${cls} ${isMe ? 'myself' : ''}">
        ${i+1}. ${medal} ${esc(name)} — ${pts} т.${timeText}
      </div>`;
    })
    .join("");

  updateRankingTitle(index);
}

/* ------------------------- LIVE "кой е отговорил" ------------------------- */

let answersUnsub = null;
let childUnsubs = [];

function stopAnswerListener() {
  if (answersUnsub) { answersUnsub(); answersUnsub = null; }
  childUnsubs.forEach(u => u());
  childUnsubs = [];
}

function startAnswerListener(index) {
  stopAnswerListener();

  answeredNames.innerHTML = "";
  answeredList.style.display = "block";

  const answered = [];
  const watched = new Set();

  answersUnsub = onSnapshot(
    collection(db, "games", "configurator", "episodes", episodeId, "results"),
    resultsSnap => {
      resultsSnap.forEach(playerDoc => {
        const playerName = playerDoc.id;
        if (watched.has(playerName)) return;
        watched.add(playerName);

        childUnsubs.push(onSnapshot(
          doc(db, "games", "configurator", "episodes", episodeId, "results", playerName, "answers", String(index)),
          ansDoc => {
            if (ansDoc.exists() && !answered.includes(playerName)) {
              answered.push(playerName);
              answeredNames.innerHTML = answered
                .map(n => `<div>${esc(n)} отговори</div>`)
                .join("");
            }
          }
        ));
      });
    }
  );
}

/* ------------------------- Прилагане на фаза ------------------------- */

let lastPhaseSnapshot = null;

function applyPhaseImmediately(data) {
  const { index, phase, startTime, duration } = data;

  if (timerInterval) clearInterval(timerInterval);
  stopAnswerListener();

  /* ---------------------- LOBBY ---------------------- */
  if (phase === "lobby") {
    showOnly(waitingScreen);
    globalTimer.style.display = "none";
    answeredList.style.display = "none";
    renderLobbyInfo();
    return;
  }

  /* ---------------------- PRESTART ---------------------- */
  if (phase === "prestart") {
    showOnly(waitingScreen);

    waitingTitle.textContent = "Играта започва след:";
    globalTimer.style.display = "block";
    answeredList.style.display = "none";

    renderLobbyInfo();

    timerInterval = setInterval(() => updateTimer(startTime, duration), 200);
    updateTimer(startTime, duration);
    return;
  }

  /* ---------------------- QUESTION ---------------------- */
  if (phase === "question") {
    showOnly(quizDiv);
    globalTimer.style.display = "block";

    const q = questions[index];
    if (!q) return;

    qText.textContent = `${index + 1}. ${q.question}`;
    answersDiv.innerHTML = "";
    answeredNames.innerHTML = "";
    answeredList.style.display = "block";

    startAnswerListener(index);

    const fmt = getFormat();
    if (fmt === "mcq") renderMCQ(q, index, startTime);
    else if (fmt === "open_first_letter") renderLetter(q, index, startTime);
    else if (fmt === "number") renderNumber(q, index, startTime);

    lockIfAlreadyAnswered(index);

    timerInterval = setInterval(() => updateTimer(startTime, duration), 200);
    updateTimer(startTime, duration);
    return;
  }

  /* ---------------------- EXPLANATION ---------------------- */
  if (phase === "explanation") {
    globalTimer.style.display = "block";
    answeredList.style.display = "none";
    renderExplanation(index);
    timerInterval = setInterval(() => updateTimer(startTime, duration), 200);
    updateTimer(startTime, duration);
    return;
  }

  /* ---------------------- RANKING ---------------------- */
  if (phase === "ranking") {
    globalTimer.style.display = "block";
    answeredList.style.display = "none";
    renderRanking(index);
    timerInterval = setInterval(() => updateTimer(startTime, duration), 200);
    updateTimer(startTime, duration);
    return;
  }
}

/* ------------------------- Слушане на фазите ------------------------- */

onSnapshot(doc(db, "games", "configurator", "state", "current"), async snap => {
  if (!snap.exists()) return;

  const data = snap.data();
  lastPhaseSnapshot = data;

  episodeId = data.episodeId;
  if (!episodeId) return;

  if (!lobbyUnsub || lobbyEpisodeId !== episodeId) {
    if (lobbyUnsub) lobbyUnsub();
    lobbyEpisodeId = episodeId;

    lobbyUnsub = onSnapshot(
      collection(db, "games", "configurator", "episodes", episodeId, "lobby"),
      lobbySnap => {
        const names = lobbySnap.docs.map(d => d.id);
        lobbyList.innerHTML = names.length
          ? names.map(n => `<div>${esc(n)}</div>`).join("")
          : "Още няма други играчи.";
      }
    );
  }

  await loadQuestionsFromFirestore();
  await joinLobby();

  if (!ready) return;
  if (loadedEpisodeId !== episodeId) return;

  applyPhaseImmediately(data);
});
