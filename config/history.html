<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>История на играта</title>
<style>
  body {
    background: #0a1a3a;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
    line-height: 1.6;
  }
  h1 {
    color: #7fffd4;
    margin-bottom: 20px;
  }
  .question-block {
    margin-bottom: 35px;
    padding-bottom: 15px;
    border-bottom: 1px solid #2e4a7f;
  }
  .correct {
    color: #00ff88;
    font-weight: bold;
  }
  .wrong {
    color: #ff5555;
    font-weight: bold;
  }
  .close {
    color: #ffd100;
    font-weight: bold;
  }
  .label {
    color: #7fffd4;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>📘 История на играта</h1>
<div id="content">Зареждане...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, collection, getDocs
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6ds9mU-xvF1LSvhaeCNtMbROu0k",
  authDomain: "cifromania-ac182.firebaseapp.com",
  projectId: "cifromania-ac182",
  storageBucket: "cifromania-ac182.appspot.com",
  messagingSenderId: "165208255580",
  appId: "1:165208255580:web:b36744f0eb527b6571129"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const url = new URL(window.location.href);
const episodeId = url.searchParams.get("episodeId");
const player = url.searchParams.get("player");

const content = document.getElementById("content");

if (!episodeId || !player) {
  content.textContent = "Липсва информация за епизод или играч.";
  throw new Error("Missing params");
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
  ));
}

async function loadHistory() {
  // Проверка дали играчът е участвал
  const playerRef = doc(db, "games", "configurator", "episodes", episodeId, "results", player);
  const playerSnap = await getDoc(playerRef);

  if (!playerSnap.exists()) {
    content.textContent = "Нямате история за този епизод.";
    return;
  }

  // Зареждаме въпросите (хостът ги записва след края на играта)
  const episodeRef = doc(db, "games", "configurator", "episodes", episodeId);
  const episodeSnap = await getDoc(episodeRef);

  if (!episodeSnap.exists()) {
    content.textContent = "Епизодът не е намерен.";
    return;
  }

  const episodeData = episodeSnap.data();
  const questions = episodeData.questions || [];
  const format = (episodeData.config && episodeData.config.format) || "mcq";

  if (!questions.length) {
    content.textContent = "Историята ще е налична след края на играта — опитай отново след малко.";
    return;
  }

  // Отговорите на играча: от архива (нови игри), а за стари епизоди — от самите отговори
  const records = {};
  const archSnap = await getDoc(doc(db, "games", "configurator", "episodes", episodeId, "archive", player));
  if (archSnap.exists()) {
    (archSnap.data().answers || []).forEach(r => { records[String(r.index)] = r; });
  } else {
    const answersSnap = await getDocs(
      collection(db, "games", "configurator", "episodes", episodeId, "results", player, "answers")
    );
    answersSnap.forEach(d => { records[d.id] = d.data(); });
  }

  // Верният отговор според формата (за случай, че липсва в записа)
  function correctOf(q, rec) {
    if (rec && rec.correct !== undefined && rec.correct !== "") return String(rec.correct);
    if (format === "number") return String(q.number);
    if (format === "open_first_letter") {
      return [q.letter, ...(q.alt_letters || [])].map(x => String(x == null ? "" : x).trim().toUpperCase()).join(" / ");
    }
    return String(q.correct || "").trim();
  }

  let html = "";

  questions.forEach((q, i) => {
    const rec = records[String(i)];
    const hasAnswer = rec && rec.answer !== undefined && rec.answer !== null && String(rec.answer).trim() !== "";
    const yourAnswer = hasAnswer ? String(rec.answer) : "—";
    const correct = correctOf(q, rec);
    const explanation = q.explanation || "";
    const points = rec && typeof rec.points === "number" ? rec.points : null;

    let verdict = "wrong", verdictText = "✘ Грешно";
    if (rec && rec.isCorrect) { verdict = "correct"; verdictText = "✔ Вярно"; }
    else if (format === "number" && points > 0) { verdict = "close"; verdictText = "≈ Близо"; }

    html += `
      <div class="question-block">
        <div class="label">${i+1}. ${esc(q.question)}</div>

        <div><span class="label">Твоят отговор:</span> ${esc(yourAnswer)}</div>
        <div><span class="label">Верен отговор:</span> ${esc(correct)}</div>

        <div class="${verdict}">
          ${verdictText}${points !== null ? ` · ${points} т.` : ""}
        </div>

        <div style="margin-top:10px;">${esc(explanation)}</div>
      </div>
    `;
  });

  content.innerHTML = html;
}

loadHistory();
</script>

</body>
</html>
