<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>.</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif;padding:14px;max-width:720px;margin:auto}
.row{display:flex;gap:6px;align-items:center;margin:4px 0}
.row input{padding:6px;border-radius:6px;border:1px solid #444;background:#222;color:#eee}
.row .n{flex:1;min-width:0}.row .p{width:110px}.row .t{width:90px}
button{padding:8px 12px;border:0;border-radius:8px;background:#3b5bdb;color:#fff;margin:4px 4px 4px 0}
button.x{background:#c0392b;padding:6px 10px}.msg{margin:8px 0;color:#9be7a1}
</style></head><body>
<h3 id="h">Поправка на крайното класиране</h3>
<div id="msg" class="msg"></div><div id="box"></div>
<div id="btns" style="display:none"><button id="add">+ ред</button><button id="sort">Подреди по точки</button><button id="save">Запази</button></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
const GAME_ID = new URLSearchParams(location.search).get("game") || "quizmix100";   // ?game=megalite  или  ?game=megaquiz10
const ADMIN_CODE = "t861182";
const db = getFirestore(initializeApp({
  apiKey: "AIzaSyB6ds9mU-xvF1LSvhaeCNtMbROu0k", authDomain: "cifromania-ac182.firebaseapp.com",
  projectId: "cifromania-ac182", storageBucket: "cifromania-ac182.appspot.com",
  messagingSenderId: "165208255580", appId: "1:165208255580:web:b36744f0eb527b6571129" }));
const ref = doc(db, "games", GAME_ID, "state", "current");
const box = document.getElementById("box"), msg = document.getElementById("msg");
let rows = [], extraKeys = [];
const code = prompt("Код:");
if (code === null || code.trim() !== ADMIN_CODE) { document.body.innerHTML = ""; throw new Error("no"); }
const num = v => Number(String(v).replace(",", "."));
function draw() {
  box.innerHTML = "";
  rows.forEach((r, i) => {
    const d = document.createElement("div"); d.className = "row";
    d.innerHTML = `<span style="width:24px;opacity:.6">${i + 1}.</span><input class="n" value="${String(r.name).replace(/"/g, "&quot;")}"><input class="p" value="${r.points}"><input class="t" value="${r.time ?? ""}" placeholder="време"><button class="x">✕</button>`;
    const [n, p, t, x] = d.querySelectorAll("input,button");
    n.oninput = () => r.name = n.value; p.oninput = () => r.points = num(p.value); t.oninput = () => { if (t.value !== "") r.time = num(t.value); };
    x.onclick = () => { rows.splice(i, 1); draw(); };
    box.appendChild(d);
  });
}
const sortRows = () => rows.sort((a, b) => (b.points - a.points) || ((a.time ?? 1e9) - (b.time ?? 1e9)));
(async () => {
  const sn = await getDoc(ref); const d = sn.exists() ? sn.data() : {};
  if (!Array.isArray(d.rows)) { msg.style.color = "#ff8a80"; msg.textContent = "Няма класиране в текущото състояние на играта (phase: " + (d.phase || "—") + ")."; return; }
  rows = d.rows.map(r => ({ ...r })); msg.textContent = "Игра: " + GAME_ID + " · фаза: " + d.phase + " · " + rows.length + " реда"; draw();
  document.getElementById("btns").style.display = "block";
})();
document.getElementById("add").onclick = () => { rows.push({ name: "", points: 0, time: 0 }); draw(); };
document.getElementById("sort").onclick = () => { sortRows(); draw(); };
document.getElementById("save").onclick = async () => {
  rows = rows.filter(r => String(r.name).trim()); sortRows();
  try { await setDoc(ref, { rows }, { merge: true }); msg.style.color = "#9be7a1"; msg.textContent = "✓ Записано (подредено по точки). Презареди играта, за да се види."; draw(); }
  catch (e) { msg.style.color = "#ff8a80"; msg.textContent = "Грешка: " + e.message; }
};
</script></body></html>
