<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Старт на Парашут БГ</title>
<style>
  body { background:#001a33; color:white; text-align:center; padding:40px; font-family:Arial; }
  button {
    padding:15px 30px; font-size:1.4em; border:none; border-radius:10px;
    background:#ffd100; color:#111; font-weight:bold; cursor:pointer;
  }
  input, select {
    padding:10px; font-size:1.2em; border-radius:8px; border:none;
    margin-bottom:20px; width:220px; text-align:center;
  }
  .field-row { margin: 10px 0; font-size: 1.1em; }
  .field-row label { display: inline-block; width: 260px; text-align: right; margin-right: 10px; }
</style>
</head>
<body>
<h1>🪂 Старт на Парашут БГ 1</h1>

<div class="field-row">
  <label>Име на епизод:</label>
  <input id="ep" placeholder="пример: parashut01">
</div>

<div class="field-row">
  <label>Час за старт на играта:</label>
  <input type="time" id="startTime">
</div>

<div class="field-row">
  <label>Игра / JSON пул:</label>
  <select id="poolSelect">
    <option value="parashutbg/objects.json">Парашут БГ (градове)</option>
    <option value="licnostibg/personalities.json">Личности БГ (родни градове)</option>
  </select>
</div>

<div class="field-row">
  <label>Брой обекти в тази игра:</label>
  <input type="number" id="objCount" value="30" min="1">
</div>

<div class="field-row">
  <label>Режим на подбор:</label>
  <select id="mode">
    <option value="random">Случаен избор от пула</option>
    <option value="ordered">По реда в JSON-а (ученически режим)</option>
  </select>
</div>

<br>
<button id="startBtn">СТАРТ</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, deleteDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

/* ⚠️ Същият Firebase проект като в index.html */
const firebaseConfig = {
  apiKey: "AIzaSyB6ds9mU-xvF1LSvhaeCNtMbROu0k",
  authDomain: "cifromania-ac182.firebaseapp.com",
  projectId: "cifromania-ac182",
  storageBucket: "cifromania-ac182.appspot.com",
  messagingSenderId: "165208255580",
  appId: "1:165208255580:web:b36744f0eb527b6571129"
};
const GAME_ID = "parashut_bg_live";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== РЪЧНО ПРОМЕНЯЕМИ ВРЕМЕНА (в мс) =====
const LOBBY_TIME = 1000;
const Q          = 20000;  // 20 сек за клик върху картата
const EXPL       = 15000;
const RANK       = 15000;

let pool = [];

/* ⭐ Всеки JSON пул носи собствена карта + калибрация.
   ВАЖНО: "image" пътят е спрямо ПАПКАТА НА index.html на съответната
   игра (не спрямо този start файл) - защото index.html зарежда
   картинката от своето собствено местоположение. Личности БГ засега
   преизползва картата на България - когато я направиш, увери се, че
   bulgaria.jpg е налична в папката на licnostibg/index.html (копие
   или коригиран относителен път), иначе картинката ще се счупи по
   същия начин, както се случи при първия тест. */
const MAP_CONFIGS = {
  "parashutbg/objects.json": {
    image: "bulgaria.jpg",
    width: 1800, height: 1183,
    coefLon: { a: 0.00379116, b: 0.00000355, c: 22.078205 },
    coefLat: { a: 0.00001928, b: -0.00278894, c: 44.385047 },
    scoringRanges: [
      { maxKm: 10,  points: 10 },
      { maxKm: 20,  points: 5  },
      { maxKm: 30,  points: 3  },
      { maxKm: 60,  points: 2  },
      { maxKm: 100, points: 1  }
    ]
  },
  "licnostibg/personalities.json": {
    image: "bulgaria.jpg",
    width: 1800, height: 1183,
    coefLon: { a: 0.00379116, b: 0.00000355, c: 22.078205 },
    coefLat: { a: 0.00001928, b: -0.00278894, c: 44.385047 },
    scoringRanges: [
      { maxKm: 10,  points: 10 },
      { maxKm: 20,  points: 5  },
      { maxKm: 30,  points: 3  },
      { maxKm: 60,  points: 2  },
      { maxKm: 100, points: 1  }
    ]
  }
  // ⭐ Когато добавим Европа: нов запис тук с нейна image/width/height/
  // coefLon/coefLat И собствен scoringRanges, изчислен по мащабния
  // множител спрямо България (виж обяснението в чата).
};

async function loadPool(poolFile) {
  const res = await fetch(poolFile);
  pool = await res.json();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickObjects(count, mode) {
  const n = Math.min(count, pool.length);
  if (mode === "ordered") return pool.slice(0, n);
  return shuffle(pool).slice(0, n);
}

async function setState(ep, index, phase, durationMs) {
  await setDoc(
    doc(db, "games", GAME_ID, "state", "current"),
    { episodeId: ep, index, phase, startTime: serverTimestamp(), duration: durationMs },
    { merge: false }
  );
}

async function resetState() {
  try { await deleteDoc(doc(db, "games", GAME_ID, "state", "current")); } catch(e) {}
}

async function runGame(ep, objects) {
  const total = objects.length;
  let t = 0;
  for (let i = 0; i < total; i++) {
    setTimeout(() => setState(ep, i, "question", Q), t);
    t += Q;
    setTimeout(() => setState(ep, i, "explanation", EXPL), t);
    t += EXPL;
    setTimeout(() => setState(ep, i, "ranking", RANK), t);
    t += RANK;
  }
}

document.getElementById("startBtn").onclick = async () => {
  const ep = document.getElementById("ep").value.trim();
  const startTimeRaw = document.getElementById("startTime").value;
  const objCount = parseInt(document.getElementById("objCount").value, 10) || 30;
  const mode = document.getElementById("mode").value;
  const poolFile = document.getElementById("poolSelect").value;

  if (!ep) return alert("Въведи име на епизод!");
  if (!startTimeRaw) return alert("Избери час за старт!");

  await loadPool(poolFile);
  if (!pool.length) return alert("Избраният JSON пул е празен или не се зареди!");

  const selected = pickObjects(objCount, mode);
  const mapConfig = MAP_CONFIGS[poolFile];
  if (!mapConfig) return alert("Няма зададена карта/калибрация за избрания пул!");

  const [hh, mm] = startTimeRaw.split(":").map(Number);
  const now = new Date();
  let startAt = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0).getTime();
  if (startAt <= Date.now()) startAt += 24 * 60 * 60 * 1000;

  const prestartDuration = startAt - Date.now() - LOBBY_TIME;
  if (prestartDuration < 0) return alert("Избраният час е твърде близо! Избери по-късен час.");

  await resetState();

  // ⭐ Записваме избраните обекти в документа на епизода - ВСИЧКИ играчи
  // ще четат точно този списък, в точно този ред.
  await setDoc(
    doc(db, "games", GAME_ID, "episodes", ep),
    { objects: selected, mapConfig, createdAt: Date.now(), mode },
    { merge: false }
  );

  await setState(ep, 0, "lobby", LOBBY_TIME);
  setTimeout(() => setState(ep, 0, "prestart", prestartDuration), LOBBY_TIME);
  setTimeout(() => runGame(ep, selected), LOBBY_TIME + prestartDuration);

  const h = Math.floor(prestartDuration / 3600000);
  const m = Math.floor((prestartDuration % 3600000) / 60000);
  alert(`Парашут БГ стартиран! ${selected.length} обекта (${mode === "random" ? "случаен избор" : "по ред"}). Лоби 1 сек → Престарт ${h > 0 ? h + "ч " : ""}${m}мин → Старт в ${startTimeRaw}`);
};
</script>
</body>
</html>
