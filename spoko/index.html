<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🦉 Игри на Знания - Спокойна игра 🦉</title>

  <link rel="manifest" href="manifest.json">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }
  </script>

  <!-- Google tag -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PK66NTHPN8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PK66NTHPN8');
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow-x: hidden; overflow-y: auto; }

    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      font-size: 18px; font-family: 'Segoe UI', Arial, sans-serif;
      max-width: 900px; margin: 0 auto; padding: 20px;
      background: #00264d;
      color: #ffffff;
    }

    h1 {
      text-align: center; color: #ffd100;
      font-size: clamp(1.5em, 4vw, 2em);
      margin: 10px auto 15px auto;
      text-shadow: 0 0 5px #ffb400;
    }

    #quiz, #start-screen, #waiting-screen {
      width: 100%; max-width: 600px; text-align: center;
      margin-top: 30px;
      background: rgba(255,255,255,0.05);
      border-radius: 16px; padding: 20px;
      box-shadow: 0 0 10px rgba(255,209,0,0.2);
    }

    #question { font-size: 1.6em; margin: 20px 0; font-weight: 600; }

    .answers button {
      display: block; width: 100%; margin: 10px 0; padding: 16px;
      border: none; border-radius: 10px; cursor: pointer;
      font-size: 1.2em; background: #333; color: #fff;
      transition: 0.2s;
    }

    .answers button:hover { background: #444; transform: scale(1.02); }
    .answers button.correct { background: #2e7d32; }
    .answers button.wrong { background: #b71c1c; }

    #timer {
      text-align: center; font-weight: 800; margin: 20px 0;
      font-size: clamp(1.8em, 5vw, 2.6em);
      color: #ffeb3b; text-shadow: 0 0 12px #ffcc00;
    }
    #timer.warning { color: #ff4c4c; }

    /* ⭐ Локален таймер за лобито (30 сек. за запознаване с правилата) */
    #lobby-timer {
      text-align: center; font-weight: 800; margin: 10px 0 20px 0;
      font-size: clamp(1.8em, 5vw, 2.6em);
      color: #ffeb3b; text-shadow: 0 0 12px #ffcc00;
    }
    #lobby-timer.warning { color: #ff4c4c; }

    #status { margin-top: 10px; font-weight: bold; min-height: 30px; }

    #next-btn {
      margin-top: 25px; padding: 12px 18px; font-size: 1.1em;
      border: none; border-radius: 8px;
      background: #ffd100; color: #111; font-weight: bold; cursor: pointer;
    }
    #next-btn:hover { background:#ffcc33; transform:scale(1.05); }

    input {
      padding: 10px; font-size: 1.1em; border-radius: 8px;
      border: 1px solid #ccc; width: 80%; margin-bottom: 10px;
    }

    button.start, button.continue-btn {
      margin-top: 10px; padding: 12px 20px; font-size: 1.1em;
      border-radius: 8px; border: none;
      background: #ffd100; color: #111; font-weight: bold; cursor: pointer;
    }
    button.start:hover, button.continue-btn:hover {
      background:#ffcc33; transform:scale(1.05);
    }

    #current-score {
      margin: 15px 0; font-size: 1.3em;
      color: #ffd100; font-weight: bold; display: none;
    }

    #explanation {
      display:none; background:rgba(255,255,255,0.08);
      padding:20px; margin-top:20px;
      border-radius:12px; max-width:600px; text-align:center;
    }

    #explanation .button-row {
      display:flex; justify-content:center; gap:12px; margin-top:20px;
    }

    .yellow-btn {
      background:#ffd100; color:#111;
      padding:14px 22px; font-size:1.1em;
      border-radius:10px; border:none; font-weight:bold; cursor:pointer;
    }
    .yellow-btn:hover { background:#ffcc33; transform:scale(1.05); }

   #seconds, #lobby-seconds {
  display: inline-block;
  min-width: 90px;
  text-align: center;
  font-family: "Consolas", "Courier New", monospace;
}

    /* ⭐ Стилове за лобито, взети от Светкавичен куиз */
    #lobby-image {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    #lobby-instructions {
      text-align: left;
      font-size: 1em;
      line-height: 1.8;
      color: #cce8ff;
      margin-bottom: 15px;
      background: rgba(255,255,255,0.05);
      padding: 12px;
      border-radius: 10px;
    }

    #lobby-instructions p { margin-bottom: 6px; }
    #lobby-instructions strong { color: #ffd100; }
  </style>
</head>

<body>
<audio id="bg-music" src="music.mp3" loop preload="auto"></audio>


<h1>Игри на Знания<br> 🦉 Спокойна игра 🦉<br>🦉 Чулова, Русев🦉</h1>

<div id="start-screen">
  <p>Въведете Вашето ID:</p>

  <input type="text" id="player-id" placeholder="въведи кода си..." /><br>

  <button class="start" id="start-btn">Започни!</button><br>

  <button class="continue-btn" id="continue-btn" style="display:none;">
    Продължи от мястото, където спряхте
  </button>

  <div id="last-result" style="margin-top:15px;"></div>
</div>

<!-- ⭐ ЛОБИ ЕКРАН — локален, с 30 сек. таймер за запознаване с правилата -->
<div id="waiting-screen" style="display:none;">
  <h2>Играта започва след:</h2>

  <div id="lobby-timer">
    <span id="lobby-seconds">30 сек.</span>
  </div>

  <img id="lobby-image" src="https://i.imgur.com/t9VR2lr.jpeg" alt="Игри на Знания" />

  <div id="lobby-instructions">
    <!-- ⭐ Попълва се динамично от JS, след като въпросите се заредят -->
  </div>

  <button class="start" id="skip-lobby-btn">Продължи веднага</button>
</div>

<div id="quiz" style="display:none;">
  <div id="timer">
    <span class="label">Оставащо време:</span>
    <span id="seconds">20 сек.</span>
  </div>

  <div id="question"></div>
  <div id="answers" class="answers"></div>
  <div id="status"></div>
  <button id="next-btn" disabled>Следващ въпрос</button>
  <div id="current-score"></div>
</div>

<div id="explanation">
  <div id="explanation-text" style="font-size:1.2em; margin-bottom:20px;"></div>

  <div class="button-row">
    <button id="next-question-btn" class="yellow-btn">Следващ въпрос</button>
    <button id="close-explanation-btn" class="yellow-btn">Затвори</button>
  </div>
</div>

<script src="players.js"></script>

<script type="module">

// ===============================
// НАСТРОЙКИ
// ===============================
const EPISODE_ID = "episodeId70-chr";
const LOBBY_SECONDS = 30;

// ===============================
// FIREBASE
// ===============================
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { 
  getFirestore, doc, setDoc
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6ds9mU-xvF1LSvhaeCNtMbROu0k",
  authDomain: "cifromania-ac182.firebaseapp.com",
  projectId: "cifromania-ac182",
  storageBucket: "cifromania-ac182.appspot.com",
  messagingSenderId: "165208255580",
  appId: "1:165208255580:web:b36744f0eb527b6571129"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===============================
// DOM ЕЛЕМЕНТИ
// ===============================
const startScreen = document.getElementById('start-screen');
const playerIdInput = document.getElementById('player-id');
const startBtn = document.getElementById('start-btn');
const continueBtn = document.getElementById('continue-btn');
const lastResultDiv = document.getElementById('last-result');

const waitingScreen = document.getElementById('waiting-screen');
const lobbySecondsSpan = document.getElementById('lobby-seconds');
const lobbyTimerDiv = document.getElementById('lobby-timer');
const lobbyInstructions = document.getElementById('lobby-instructions');
const skipLobbyBtn = document.getElementById('skip-lobby-btn');

const qText = document.getElementById('question');
const answersDiv = document.getElementById('answers');
const nextBtn = document.getElementById('next-btn');
const status = document.getElementById('status');
const timerDisplay = document.getElementById('timer');
const currentScoreDiv = document.getElementById('current-score');

const quizDiv = document.getElementById('quiz');
const explanationDiv = document.getElementById('explanation');
const explanationText = document.getElementById('explanation-text');
const bgMusic = document.getElementById("bg-music");

// ===============================
// СЪСТОЯНИЕ
// ===============================
let playerId = "";
let playerName = "";
let questions = [];
let idx = 0;
let score = 0;
let maxScore = 0;
let timeLeft = 20;
let timer;
let lobbyTimer;
let gameHistory = []; // индексирано по номер на въпрос (0..questions.length-1)

// ===============================
// ТОЧКУВАНЕ ПО НИВА (както в Светкавичен куиз)
// въпроси 1-10  -> 1 точка
// въпроси 11-20 -> 2 точки
// въпроси 21-30 -> 3 точки
// ===============================
function pointsForIndex(i) {
  if (i < 10) return 1;
  if (i < 20) return 2;
  return 3;
}

// ===============================
// ЗАРЕЖДАНЕ НА ВЪПРОСИ
// ===============================
try {
  const res = await fetch('questions.json');
  questions = await res.json();

  maxScore = questions.reduce((sum, _, i) => sum + pointsForIndex(i), 0);

  lobbyInstructions.innerHTML = `
    <p>Очакват ви <strong>${questions.length}</strong> въпроса с повишаваща степен на трудност.</p>
    <p>Отговаря се с натискане на бутон върху някой от четирите отговора.</p>
    <p>Играете сами, в свое темпо — играта не чака други играчи.</p>
    <p>Време за мислене и отговор — <strong>20 секунди</strong> на въпрос.</p>
    <p>Точкуване — първите 10 въпроса - <strong>по 1 точка</strong>, вторите 10 - <strong>по 2 точки</strong>, последните 10 носят по <strong>3 точки</strong>.</p>
  `;
} catch(e) {
  qText.textContent = "Грешка при зареждане на въпросите.";
}

// ===============================
// ПОСЛЕДЕН РЕЗУЛТАТ
// ===============================
const last = JSON.parse(localStorage.getItem('lastResult'));
if (last) {
  lastResultDiv.innerHTML =
    `<b>Последен резултат:</b><br>${last.name} — ${last.score}/${last.total} точки (${last.percent}%)<br>
     <small>${last.date}</small>`;
}

// ===============================
// ПРОДЪЛЖАВАНЕ (прескача лобито — правилата вече са видени)
// ===============================
const saved = JSON.parse(localStorage.getItem('progress'));
if (saved && saved.idx < questions.length) {
  continueBtn.style.display = "inline-block";
  continueBtn.textContent = `Продължи от въпрос ${saved.idx + 1}`;
}

continueBtn.onclick = () => {
  try { bgMusic.play(); } catch(e){}
  playerId = saved.playerId;
  playerName = saved.name;
  idx = saved.idx;
  score = saved.score;

  const savedHistory = JSON.parse(localStorage.getItem('gameHistory'));
  gameHistory = (Array.isArray(savedHistory) && savedHistory.length === questions.length)
    ? savedHistory
    : new Array(questions.length).fill(null);

  startScreen.style.display = "none";
  quizDiv.style.display = "block";
  renderQuestion(idx);
};

// ===============================
// FIRESTORE ЗАПИС (само регистрация на влизане, без резултати в реално време)
// ===============================
async function registerPlayerInFirestore() {
  await setDoc(
    doc(db, "games", "spoko", "episodes", EPISODE_ID, "players", playerId),
    {
      playerId,
      playerName,
      joinedAt: Date.now()
    }
  );
}

// ===============================
// СТАРТ -> ЛОБИ (30 сек. запознаване с правилата) -> ВЪПРОСИ
// ===============================
startBtn.onclick = async () => {
  try { bgMusic.play(); } catch(e){}

  const id = playerIdInput.value.trim();
  if (!id) return alert("Въведете ID!");

  if (!PLAYERS[id]) {
    alert("Невалидно ID!");
    return;
  }

  playerId = id;
  playerName = PLAYERS[id];

  await registerPlayerInFirestore();

  localStorage.removeItem("progress");
  localStorage.removeItem("gameHistory");

  idx = 0;
  score = 0;
  gameHistory = new Array(questions.length).fill(null);

  startScreen.style.display = "none";
  showLobby();
};

function showLobby() {
  waitingScreen.style.display = "block";
  let secondsLeft = LOBBY_SECONDS;

  lobbyTimerDiv.classList.remove("warning");
  lobbySecondsSpan.textContent = `${secondsLeft} сек.`;

  clearInterval(lobbyTimer);
  lobbyTimer = setInterval(() => {
    secondsLeft--;
    lobbySecondsSpan.textContent = `${secondsLeft} сек.`;

    if (secondsLeft <= 5) lobbyTimerDiv.classList.add("warning");

    if (secondsLeft <= 0) {
      clearInterval(lobbyTimer);
      startQuizFromLobby();
    }
  }, 1000);
}

function startQuizFromLobby() {
  clearInterval(lobbyTimer);
  waitingScreen.style.display = "none";
  quizDiv.style.display = "block";
  renderQuestion(idx);
}

skipLobbyBtn.onclick = startQuizFromLobby;

// ===============================
// ТАЙМЕР ЗА ВЪПРОС (20 сек., приема callback при изтичане)
// ===============================
function startTimer(onTimeout) {
  clearInterval(timer);
  timeLeft = 20;

  document.getElementById("seconds").textContent = `${timeLeft} сек.`;
  timerDisplay.classList.remove("warning");

  timer = setInterval(() => {
    timeLeft--;
    document.getElementById("seconds").textContent = `${timeLeft} сек.`;

    if (timeLeft <= 5) timerDisplay.classList.add("warning");

    if (timeLeft <= 0) {
      clearInterval(timer);
      onTimeout();
    }
  }, 1000);
}

// ===============================
// РЕНДЕР НА ВЪПРОС
// ===============================
function normalize(s){ return String(s).trim(); }

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function lockAnswers() {
  Array.from(answersDiv.children).forEach(b => b.disabled = true);
}

function renderQuestion(i) {
  const q = questions[i];

  qText.textContent = `${i+1}. ${q.question}`;
  answersDiv.innerHTML = "";
  status.textContent = "";
  nextBtn.disabled = true;
  explanationDiv.style.display = "none";

  currentScoreDiv.style.display = "none";

  const shuffledAnswers = shuffleArray([...q.answers]);

  shuffledAnswers.forEach(ans => {
    const btn = document.createElement("button");
    btn.textContent = ans;

    btn.onclick = () => {
      lockAnswers();
      clearInterval(timer);

      const correct = normalize(q.correct);
      const chosen = normalize(ans);
      const isCorrect = chosen === correct;

      if (isCorrect) {
        btn.classList.add("correct");
        status.textContent = "✅ Верен отговор!";
        score += pointsForIndex(i);
      } else {
        btn.classList.add("wrong");
        status.textContent = `❌ Грешно! Верният отговор е: ${q.correct}`;
        Array.from(answersDiv.children).forEach(b => {
          if (normalize(b.textContent) === correct) b.classList.add("correct");
        });
      }

      gameHistory[i] = {
        question: q.question,
        yourAnswer: ans,
        correctAnswer: q.correct,
        correct: isCorrect,
        explanation: q.explanation
      };

      currentScoreDiv.textContent = `Текущ резултат: ${score} точки`;
      currentScoreDiv.style.display = "block";

      explanationText.innerHTML = q.explanation;
      explanationDiv.style.display = "block";

      nextBtn.disabled = false;

      localStorage.setItem("progress", JSON.stringify({
        playerId,
        name: playerName,
        idx: i,
        score
      }));
      localStorage.setItem("gameHistory", JSON.stringify(gameHistory));
    };

    answersDiv.appendChild(btn);
  });

  startTimer(() => {
    // ⏰ Времето изтече — записваме въпроса в историята като пропуснат
    lockAnswers();
    status.textContent = "⏰ Времето изтече!";

    const correct = normalize(q.correct);
    Array.from(answersDiv.children).forEach(b => {
      if (normalize(b.textContent) === correct) b.classList.add("correct");
    });

    gameHistory[i] = {
      question: q.question,
      yourAnswer: null,
      correctAnswer: q.correct,
      correct: false,
      explanation: q.explanation
    };

    currentScoreDiv.textContent = `Текущ резултат: ${score} точки`;
    currentScoreDiv.style.display = "block";

    explanationText.innerHTML = q.explanation;
    explanationDiv.style.display = "block";

    nextBtn.disabled = false;

    localStorage.setItem("progress", JSON.stringify({
      playerId,
      name: playerName,
      idx: i,
      score
    }));
    localStorage.setItem("gameHistory", JSON.stringify(gameHistory));
  });
}

// ===============================
// НАВИГАЦИЯ
// ===============================
nextBtn.onclick = nextQuestionFromExplanation;
document.getElementById("next-question-btn").onclick = nextQuestionFromExplanation;

function nextQuestionFromExplanation() {
  explanationDiv.style.display = "none";
  idx++;

  if (idx >= questions.length) return finishGame();

  renderQuestion(idx);
}
// ===============================
// КРАЙ НА ИГРАТА
// ===============================
function finishGame() {
  clearInterval(timer);

  const percent = Math.round(score / maxScore * 100);

  qText.innerHTML =
    `🏁 Край на играта, <b>${playerName}</b>!<br><br>
    Резултат: <b>${score}</b> от <b>${maxScore}</b> точки (${percent}%).<br><br>`;

  answersDiv.innerHTML = "";
  nextBtn.disabled = true;
  timerDisplay.textContent = "";
  currentScoreDiv.style.display = "none";

  localStorage.setItem("lastResult", JSON.stringify({
    name: playerName,
    score,
    total: maxScore,
    percent,
    date: new Date().toLocaleString('bg-BG')
  }));

  localStorage.removeItem("progress");
  localStorage.removeItem("gameHistory");

  qText.innerHTML += `
    <div style="display:flex; justify-content:center; gap:12px; margin-top:20px;">
      <button id="history-btn" class="yellow-btn">История на играта</button>
      <button id="retry-btn" class="yellow-btn">Опитай пак</button>
    </div>
  `;

  document.getElementById("history-btn").onclick = showHistoryScreen;
  document.getElementById("retry-btn").onclick = restartGame;
}

// ===============================
// ИСТОРИЯ — подредена по номер на въпроса (1,2,3...),
// показва ВСИЧКИ въпроси, независимо дали е отговорено на тях
// ===============================
function showHistoryScreen() {
  quizDiv.style.display = "none";
  explanationDiv.style.display = "none";
  startScreen.style.display = "none";

  let historyDiv = document.getElementById("history-screen");
  if (!historyDiv) {
    historyDiv = document.createElement("div");
    historyDiv.id = "history-screen";
    historyDiv.style.padding = "20px";
    historyDiv.style.maxWidth = "600px";
    historyDiv.style.marginTop = "20px";
    historyDiv.style.background = "rgba(255,255,255,0.08)";
    historyDiv.style.borderRadius = "12px";
    historyDiv.style.textAlign = "left";
    document.body.appendChild(historyDiv);
  }

  historyDiv.innerHTML = "<h2>📘 История на играта</h2><br>";

  questions.forEach((q, i) => {
    const h = gameHistory[i];
    let answerLine, borderColor;

    if (!h || h.yourAnswer === null) {
      answerLine = `<span style="color:#aaaaaa; font-style:italic;">⬜ Не е отговорено</span>`;
      borderColor = "#888";
    } else if (h.correct) {
      answerLine = `Твоят отговор: <span style="color:#2ecc71">${h.yourAnswer}</span> ✔`;
      borderColor = "#2ecc71";
    } else {
      answerLine = `Твоят отговор: <span style="color:#e74c3c">${h.yourAnswer}</span> ✘`;
      borderColor = "#e74c3c";
    }

    historyDiv.innerHTML += `
      <div style="margin-bottom:20px; padding:12px; border-left:6px solid ${borderColor}; background:rgba(255,255,255,0.04); border-radius:8px;">
        <b>${i+1}. ${q.question}</b><br><br>
        ${answerLine}<br>
        Верен отговор: <b style="color:#2ecc71">${q.correct}</b><br>
        <div style="margin-top:10px;color:#ddd"><i>${q.explanation || ""}</i></div>
      </div>
    `;
  });

  historyDiv.innerHTML += `
    <button id="retry2-btn" class="yellow-btn" style="margin-top:20px;">Опитай пак</button>
  `;

  document.getElementById("retry2-btn").onclick = restartGame;
}

// ===============================
// РЕСТАРТ
// ===============================
function restartGame() {
  localStorage.removeItem("progress");
  localStorage.removeItem("gameHistory");
  location.reload();
}

// ===============================
// ЗАТВАРЯНЕ НА ОБЯСНЕНИЕ
// ===============================
document.getElementById("close-explanation-btn").onclick = () => {
  explanationDiv.style.display = "none";
};

</script>

</body>
</html>
