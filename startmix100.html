function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) { hash = (hash << 5) - hash + str.charCodeAt(i); hash |= 0; }
  return Math.abs(hash) % 233280;
}

// ⭐ ВЪПРОСИТЕ СЕ ЧЕТАТ ОТ ЛОКАЛНА ПАПКА НА КОМПЮТЪРА НА ВОДЕЩИЯ (не са публични, не са в клиентите)

function folderReady() { return NEED_FILES.every(n => Array.isArray(loadedFiles[n]) && loadedFiles[n].length > 0); }

function validateQuestions() {
  const warn = [];
  const need = (arr, name, fields, extra) => (arr || []).forEach((q, i) => {
    fields.forEach(f => { if (q[f] === undefined || q[f] === null || q[f] === "") warn.push(`${name}[${i + 1}]: липсва „${f}“`); });
    if (extra) { const w = extra(q); if (w) warn.push(`${name}[${i + 1}]: ${w}`); }
  });
  const f = loadedFiles;
  need(f.questions1, "Кръг 1", ["question","answers","correct"], q => (q.answers || []).map(a => String(a).trim()).includes(String(q.correct).trim()) ? "" : "верният отговор не е сред отговорите");
  need(f.questions2, "Кръг 2", ["question","answers","correct"], q => (q.answers || []).map(a => String(a).trim()).includes(String(q.correct).trim()) ? "" : "верният отговор не е сред отговорите");
  need(f.questions3, "Кръг 3", ["question","letter"]);
  need(f.questions4, "Кръг 4", ["question","letter","image"]);
  need(f.questions5, "Кръг 5", ["question","answer","ranges"]);
  need(f.questions6, "Кръг 6", ["title","pairs"]);
  need(f.questions7, "Кръг 7", ["question","letter","video"]);
  need(f.questions8, "Кръг 8", ["title","items","groups","answers"]);
  need(f.questions10, "Дузпи", ["question","answer"]);
  need(f.pull, "Избор", ["question","answers","correct","area"], q => (q.answers || []).map(a => String(a).trim()).includes(String(q.correct).trim()) ? "" : "верният отговор не е сред отговорите");
  return warn;
}

function updateFolderStatus() {
  const el = document.getElementById("folderStatus");
  if (!el) return;
  const parts = NEED_FILES.map(n => {
    const a = loadedFiles[n];
    return a ? `<span style="color:#7CFC9A">✔ ${n}.json (${a.length})</span>` : `<span style="color:#ff8a80">✖ ${n}.json</span>`;
  });
  el.innerHTML = (folderLabel ? `<div style="opacity:.8; margin-bottom:4px;">Папка: ${folderLabel}</div>` : "") + parts.join(" &nbsp; ");
  const b = document.getElementById("startBtn");
  if (b && !b.dataset.running) b.style.opacity = folderReady() ? "1" : ".55";
}

async function ingestFiles(files, label) {
  for (const f of files) {
    const m = String(f.name || "").toLowerCase().match(/^(questions\d+|pull)\.json$/);
    if (!m) continue;
    try {
      const txt = (await f.text()).replace(/^﻿/, "");
      loadedFiles[m[1]] = JSON.parse(txt);
    } catch (e) { log(`❌ Файл ${f.name}: невалиден JSON — ${e.message}`); delete loadedFiles[m[1]]; }
  }
  if (label) folderLabel = label;
  updateFolderStatus();
  const missing = NEED_FILES.filter(n => !loadedFiles[n]);
  if (missing.length) log(`ℹ️ Още липсват: ${missing.join(", ")}`);
  else {
    const w = validateQuestions();
    log(w.length ? `⚠️ Папката е заредена, но има ${w.length} забележки:\n• ` + w.slice(0, 15).join("\n• ") : "✅ Всички файлове с въпроси са заредени и проверени.");
  }
}

async function walkDir(dirHandle, depth = 0) {
  const out = [];
  for await (const [name, h] of dirHandle.entries()) {
    if (h.kind === "file") { if (/\.json$/i.test(name)) out.push(await h.getFile()); }
    else if (depth < 2) out.push(...await walkDir(h, depth + 1));
  }
  return out;
}

// запомняме последно избраната папка (само в този браузър), за да е достатъчен един клик следващия път
function idbOpen() {
  return new Promise((res, rej) => { const r = indexedDB.open("mega100host", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function idbPut(k, v) { try { const d = await idbOpen(); await new Promise((res, rej) => { const t = d.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) {} }
async function idbGet(k) { try { const d = await idbOpen(); return await new Promise((res, rej) => { const t = d.transaction("kv"); const r = t.objectStore("kv").get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } catch (e) { return null; } }

async function pickFolder() {

    try {
      const h = await window.showDirectoryPicker({ id: "mega100q", mode: "read" });
      await idbPut("dir", h);
      await ingestFiles(await walkDir(h), h.name);
      return;
    } catch (e) { if (e && e.name === "AbortError") return; /* иначе — резервен вариант */ }
  }
  document.getElementById("folderInput").click();
}
async function reloadLastFolder() {
  const h = await idbGet("dir");
  if (!h) return alert("Още няма запомнена папка — натисни „Избери папка“.");
  try {
    let p = await h.queryPermission({ mode: "read" });
    if (p !== "granted") p = await h.requestPermission({ mode: "read" });
    if (p !== "granted") return alert("Няма разрешение за папката.");
    await ingestFiles(await walkDir(h), h.name);
  } catch (e) { alert("Не успях да прочета папката: " + (e && e.message ? e.message : e)); }
}

// ===============================
// ⭐ ТОЧКУВАНЕ (само на хоста — клиентите вече не знаят верните отговори)
// ===============================
const LATIN_TO_CYRILLIC = { "A":"А","B":"В","C":"С","E":"Е","H":"Н","K":"К","M":"М","O":"О","P":"Р","T":"Т","X":"Х","Y":"У" };
function normalizeLetter(letter) { const u = (letter || "").toUpperCase(); return LATIN_TO_CYRILLIC[u] || u; }
function normalizeLetterPlain(letter) { return (letter || "").toUpperCase(); }
function letterOk(q, input, plain) {
  const typed = (plain ? normalizeLetterPlain : normalizeLetter)(String(input || "").trim());
  if (!typed) return false;
  const main = (q.letter || "").toUpperCase();
  const alts = (q.alt_letters || []).map(l => String(l).toUpperCase());
  return typed === main || alts.includes(typed);
}
function isR1Correct(data, q) {
  if (data.guaranteed === true) return true;
  return String(data.answer || "").trim() === String(q.correct || "").trim();
}
function isR2Correct(data, q) {
  const correctNorm = String(q.correct || "").trim();
  const c1 = String(data.answer || "").trim();
  const c2 = data.answer2 ? String(data.answer2).trim() : null;
  return c1 === correctNorm || (c2 !== null && c2 === correctNorm);
}
function calcPoints5(userAnswer, q) {
  const diff = Math.abs(userAnswer - Number(q.answer));
  const r = q.ranges || {};
  if (diff === 0)     return 5;
  if (diff <= r.near) return 3;
  if (diff <= r.mid)  return 2;
  if (diff <= r.far)  return 1;
  return 0;
}
function calcPoints10_0(diffs, myDiff) {
  const unique = [...new Set(diffs)].sort((a,b)=>a-b);
  const rank = unique.indexOf(myDiff);
  if (rank < 0 || rank >= 9) return 0;
  return parseFloat((0.9 - rank*0.1).toFixed(2));
}
function calcPoints10_1(diffs, myDiff) {
  const unique = [...new Set(diffs)].sort((a,b)=>a-b);
  const rank = unique.indexOf(myDiff);
  if (rank < 0 || rank >= 9) return 0;
  return parseFloat((0.09 - rank*0.01).toFixed(4));
}
function calcPoints10_2(diffs, myDiff) {
  const unique = [...new Set(diffs)].sort((a,b)=>a-b);
  const rank = unique.indexOf(myDiff);
  if (rank < 0 || rank >= 99) return 0;
  return parseFloat((0.0099 - rank*0.0001).toFixed(6));
}
function calcPoints10(index, diffs, myDiff) {
  if (index === 0) return calcPoints10_0(diffs, myDiff);
  if (index === 1) return calcPoints10_1(diffs, myDiff);
  if (index === 2) return calcPoints10_2(diffs, myDiff);
  return 0;
}
function pointsForRanking9(ranking, correct) {
  if (!ranking || !ranking.length) return 0;
  const correctNorm = String(correct || "").trim();
  const pos = ranking.findIndex(a => String(a || "").trim() === correctNorm);
  if (pos === -1) return 0;
  return RANK_POINTS9[pos] || 0;
}
function computeCashInFinalBonus(jokers) {
  const j = jokers || {};
  let bonus = 0;
  if (!j.r1_pancake) bonus += 1;
  if (!j.r2_doubleChance) bonus += 1;
  if (!j.r2_majority) bonus += 1;
  if (!j.r2_spy) bonus += 1;
  if (!j.r3_syllable2) bonus += 1;
  if (!j.r4_syllable2) bonus += 1;
  if (!j.r7_syllable2) bonus += 1;
  return bonus;
}

// ⭐ ЖИВО СЪСТОЯНИЕ НА ХОСТА: играчи, ръчни корекции, книга с точките (ledger), отговори на жокери
// ===============================
let live = null;           // { ep, players:{име:{jokers}}, adj:{име:delta}, unsubs:[], startedAt }
let ledger = {};           // име -> { slots: { slotId: {r, idx, pts, time, ok, diff} } }
let watch = null;          // следене на отговорите за текущия въпрос
let curQ = null;           // { slot, round, q, open } — за жокерите, които искат верен отговор/подсказка

const col = (...p) => collection(db, "games", GAME_ID, "episodes", live.ep, ...p);

function putSlot(name, slot, obj) {
  if (!ledger[name]) ledger[name] = { slots: {} };
  ledger[name].slots[slot] = obj;
}

// слотът от документа (за възстановяване при „старт от кръг X“ или рестарт на хоста)
function slotFromDoc(id, data) {
  const t = (typeof data.thinkingTime === "number") ? data.thinkingTime : 0;
  if (id.startsWith("tb-")) return { r: "tb", idx: 0, pts: data.points || 0, time: 0 };
  if (id.startsWith("r9-")) return { r: 9, idx: 0, pts: data.points || 0, time: t };
  const m = id.match(/^r(\d+)-(\d+)$/);
  if (!m) return null;
  const r = Number(m[1]), idx = Number(m[2]);
  if (r === 1) { const ok = typeof data.isCorrect === "boolean" ? data.isCorrect : (data.guaranteed === true || String(data.answer || "").trim() === String(data.correct || "").trim()); return { r, idx, ok, pts: ok ? 2 : 0, time: t }; }
  if (r === 2) {
    let ok = data.isCorrect;
    if (typeof ok !== "boolean") { const c = String(data.correct || "").trim(); ok = String(data.answer || "").trim() === c || (data.answer2 ? String(data.answer2).trim() === c : false); }
    return { r, idx, ok, pts: ok ? (data.doubled ? 6 : 3) : 0, time: t };
  }
  if (r === 3 || r === 4 || r === 7) return { r, idx, ok: !!data.isCorrect, pts: data.isCorrect ? 4 : 0, time: t };
  if (r === 5) return { r, idx, pts: data.points || 0, time: t };
  if (r === 6 || r === 8) return { r, idx, pts: data.total || 0, time: t };
  if (r === 10) return { r, idx, pts: 0, diff: data.diff, time: t };
  return null;
}

async function rebuildLedger(ep) {
  ledger = {};
  const players = await getDocs(collection(db, "games", GAME_ID, "episodes", ep, "results"));
  for (const p of players.docs) {
    const ans = await getDocs(collection(db, "games", GAME_ID, "episodes", ep, "results", p.id, "answers"));
    ans.forEach(a => { const s = slotFromDoc(a.id, a.data()); if (s) putSlot(p.id, a.id, s); });
  }
}

function stopLive() {
  if (!live) return;
  live.unsubs.forEach(u => { try { u(); } catch(e) {} });
  unwatch(false);
  live = null;
}

async function startLive(ep, rebuild) {
  stopLive();
  live = { ep, players: {}, adj: {}, unsubs: [], startedAt: Date.now(), handled: new Set() };
  if (rebuild) await rebuildLedger(ep); else ledger = {};
  live.unsubs.push(onSnapshot(col("results"), snap => {
    const seen = {};
    snap.forEach(d => { seen[d.id] = { jokers: d.data().jokers || {} }; });
    live.players = seen;
    syncWatch();
  }));
  live.unsubs.push(onSnapshot(col("adjustments"), snap => {
    const a = {}; snap.forEach(d => { a[d.id] = Number(d.data().delta) || 0; }); live.adj = a;
  }));
  live.unsubs.push(onSnapshot(col("jokerReq"), snap => {
    snap.forEach(d => {
      if (live.handled.has(d.id)) return;
      live.handled.add(d.id);
      const req = d.data();
      if ((req.ts || 0) < live.startedAt - 2000) return;   // стара заявка от преди старта
      handleJokerReq(d.id, req);
    });
  }));
  // изчакваме първия снимък на играчите, за да е пълно класирането още от началото
  await sleep(600);
}

// ⭐ Класиране от книгата с точките — без нито едно четене от базата
function standingsNow(isFinal) {
  const names = new Set([...Object.keys(live ? live.players : {}), ...Object.keys(ledger)]);
  const r10 = [[], [], []];
  names.forEach(n => {
    const L = ledger[n]; if (!L) return;
    Object.values(L.slots).forEach(s => { if (s.r === 10 && s.idx >= 0 && s.idx <= 2 && typeof s.diff === "number") r10[s.idx].push(s.diff); });
  });
  const bonusSizes = { 1: questions1.length, 2: questions2.length, 3: questions3.length, 4: questions4.length, 7: questions7.length };
  const list = [];
  names.forEach(name => {
    const L = ledger[name] || { slots: {} };
    let pts = 0, time = 0, r5n = 0, r5p = 0;
    const ok = { 1: 0, 2: 0, 3: 0, 4: 0, 7: 0 };
    Object.values(L.slots).forEach(s => {
      time += s.time || 0;
      if (s.r === 10) { if (s.idx >= 0 && s.idx <= 2 && typeof s.diff === "number") pts += calcPoints10(s.idx, r10[s.idx], s.diff); return; }
      pts += s.pts || 0;
      if (ok[s.r] !== undefined && s.ok) ok[s.r]++;
      if (s.r === 5) { r5n++; if (s.pts === 5) r5p++; }
    });
    [1, 2, 3, 4, 7].forEach(r => { if (bonusSizes[r] > 0 && ok[r] === bonusSizes[r]) pts += 3; });
    if (questions5.length > 0 && r5n === questions5.length && r5p === questions5.length) pts += 3;
    pts += (live && live.adj[name]) || 0;
    const jokersData = (live && live.players[name] && live.players[name].jokers) || {};
    const bonus = isFinal ? computeCashInFinalBonus(jokersData) : 0;
    list.push({ name, points: Math.round((pts + bonus) * 10000) / 10000, time, bonus, jokersData });
  });
  return list.sort((a, b) => b.points !== a.points ? b.points - a.points : (a.time !== b.time ? a.time - b.time : a.name.localeCompare(b.name, "bg")));
}
async function computeStandingsHost(ep, isFinal) { return standingsNow(isFinal); }
const rowsOf = (st, withExtra) => st.map(s => withExtra ? { name: s.name, points: s.points, time: s.time, bonus: s.bonus } : { name: s.name, points: s.points });

// ===============================
// ⭐ СЛЕДЕНЕ НА ОТГОВОРИТЕ ЗА ТЕКУЩИЯ ВЪПРОС (един слушател на играч, само на хоста)
// ===============================
function syncWatch() {
  if (!watch || !live) return;
  const names = watch.fixed || Object.keys(live.players);
  names.forEach(n => {
    if (watch.subs.has(n)) return;
    const slot = watch.slot;
    const u = onSnapshot(doc(db, "games", GAME_ID, "episodes", live.ep, "results", n, "answers", slot), sn => {
      if (!watch || watch.slot !== slot) return;
      if (sn.exists()) {
        if (!(n in watch.data)) watch.order.push(n);
        watch.data[n] = sn.data();
      } else { delete watch.data[n]; }
      watch.dirty = true;
    });
    watch.subs.set(n, u);
  });
}
function answeredText(slot, n, d) {
  if (/^r6-/.test(slot)) return `${n} — ${(d.pairs || []).length} чифта`;
  if (/^r8-/.test(slot)) return `${n} — ${Object.keys(d.assignments || {}).length} обекта`;
  if (/^r9-/.test(slot)) return `${n} — ${(d.ranking || []).length}/5 подредени`;
  return `${n} отговори`;
}
async function publishAnswered(force) {
  if (!watch || (!watch.dirty && !force)) return;
  watch.dirty = false;
  const slot = watch.slot;
  const items = watch.order.filter(n => watch.data[n]).map(n => answeredText(slot, n, watch.data[n]));
  try { await setDoc(doc(db, "games", GAME_ID, "state", "answered"), { slot, items, ts: Date.now() }); } catch(e) {}
}
function watchSlot(slot, fixedNames) {
  unwatch(false);
  watch = { slot, data: {}, order: [], subs: new Map(), dirty: false, fixed: fixedNames || null, timer: null };
  syncWatch();
  watch.timer = setInterval(() => publishAnswered(false), 4000);
}
function unwatch(clearBoard) {
  if (!watch) return;
  clearInterval(watch.timer);
  watch.subs.forEach(u => { try { u(); } catch(e) {} });
  watch = null;
  if (clearBoard) setDoc(doc(db, "games", GAME_ID, "state", "answered"), { slot: null, items: [], ts: Date.now() }).catch(() => {});
}

// записваме обратно в документите на играчите (за историята) — на заден план, на порции
async function writeBack(items) {
  if (!live) return;
  const ep = live.ep;
  for (let i = 0; i < items.length; i += 25) {
    await Promise.all(items.slice(i, i + 25).map(it =>
      setDoc(doc(db, "games", GAME_ID, "episodes", ep, "results", it.name, "answers", it.slot), it.data, { merge: true }).catch(() => {})
    ));
  }
}

// ===============================
// ⭐ ЖОКЕРИ, ИЗИСКВАЩИ ТАЙНА (Патрондаш, Дай Три) — отговаря хостът
// ===============================
async function handleJokerReq(id, req) {
  const resp = doc(db, "games", GAME_ID, "episodes", live.ep, "jokerResp", id);
  const ok = curQ && curQ.open && curQ.slot === req.slot;
  let out = { ok: false, ts: Date.now() };
  if (ok) {
    const q = curQ.q;
    if (req.kind === "syl") out = { ok: true, text: String(q.syllable2 || "").trim(), ts: Date.now() };
    else if (req.kind === "bullet") {
      const correct = String(q.correct || "").trim();
      const cands = (req.avail || []).map(String).filter(a => a.trim() !== correct && (q.answers || []).map(x => String(x)).includes(a));
      out = { ok: true, eliminate: cands.length ? cands[Math.floor(Math.random() * cands.length)] : null, ts: Date.now() };
    }
  }
  try { await setDoc(resp, out); } catch(e) {}
}

// ===============================
// ⭐ ПУБЛИЧНА (без тайни) и "разкриваща" част от въпроса
// ===============================
function pubQ(round, q) {
  if (round === 1 || round === 2) return { question: q.question, answers: q.answers };
  if (round === 3) return { question: q.question };
  if (round === 4) return { question: q.question, image: q.image || "" };
  if (round === 5) return { question: q.question };
  if (round === 6) return { title: q.title, left: Object.keys(q.pairs).filter(k => k !== "").sort(), right: Object.values(q.pairs).filter(v => v !== "").sort() };
  if (round === 7) return { question: q.question, video: q.video || "" };
  if (round === 8) return { title: q.title, items: q.items, groups: Array.isArray(q.groups) ? q.groups : String(q.groups || "").split(",").map(s => s.trim()) };
  if (round === 9) return { question: q.question, answers: q.answers, area: q.area };
  return { question: q.question };   // 10 / дузпи
}
function revealQ(round, q) {
  if (round === 1 || round === 2 || round === 9) return { correct: q.correct, explanation: q.explanation || "" };
  if (round === 3 || round === 4 || round === 7) return { letter: q.letter, alt_letters: q.alt_letters || [], explanation: q.explanation || "" };
  if (round === 5) return { answer: Number(q.answer) };
  if (round === 6) return { pairs: q.pairs };
  if (round === 8) return { answers: q.answers };
  return { answer: q.answer, explanation: q.explanation || "" };   // 10
}

// ⭐ Точкува един въпрос от всички получени отговори. Връща { stats, scores?, rows? } за публикуване.
function scoreSlot(round, idx, slot, q) {
  const names = Object.keys(watch ? watch.data : {});
  const data = watch ? watch.data : {};
  const wb = [];
  const t = d => (typeof d.thinkingTime === "number" ? d.thinkingTime : 0);
  const res = { stats: {}, scores: null, rows: null, total: null };

  if (round === 1 || round === 2) {
    const counts = {}; (q.answers || []).forEach(a => counts[String(a).trim()] = 0);
    names.forEach(n => {
      const d = data[n];
      const ok = round === 1 ? isR1Correct(d, q) : isR2Correct(d, q);
      const pts = ok ? (round === 1 ? 2 : (d.doubled ? 6 : 3)) : 0;
      putSlot(n, slot, { r: round, idx, ok, pts, time: t(d) });
      const c1 = String(d.answer || "").trim(); if (counts[c1] !== undefined) counts[c1]++;
      if (round === 2 && d.answer2) { const c2 = String(d.answer2).trim(); if (counts[c2] !== undefined) counts[c2]++; }
      wb.push({ name: n, slot, data: { isCorrect: ok, points: pts, correct: q.correct, explanation: q.explanation || "" } });
    });
    res.stats = { counts };
  } else if (round === 3 || round === 4 || round === 7) {
    const counts = {};
    names.forEach(n => {
      const d = data[n];
      const ok = letterOk(q, d.answer, round === 7);
      putSlot(n, slot, { r: round, idx, ok, pts: ok ? 4 : 0, time: t(d) });
      const typed = (round === 7 ? normalizeLetterPlain : normalizeLetter)(d.answer || "");
      counts[typed] = (counts[typed] || 0) + 1;
      wb.push({ name: n, slot, data: { isCorrect: ok, points: ok ? 4 : 0, correct: String(q.letter || "").toUpperCase(), explanation: q.explanation || "" } });
    });
    res.stats = { counts };
  } else if (round === 5) {
    const results = [];
    names.forEach(n => {
      const d = data[n]; const ans = Number(d.answer);
      if (!Number.isFinite(ans)) return;
      const pts = calcPoints5(ans, q), diff = Math.abs(ans - Number(q.answer));
      putSlot(n, slot, { r: 5, idx, pts, diff, time: t(d) });
      results.push({ name: n, answer: ans, diff, points: pts });
      wb.push({ name: n, slot, data: { points: pts, diff, correct: Number(q.answer) } });
    });
    results.sort((a, b) => a.diff - b.diff);
    res.stats = { results };
  } else if (round === 6) {
    const totalPairs = Object.keys(q.pairs).length;
    const scores = {}, rows = [];
    names.forEach(n => {
      const d = data[n]; let correct = 0;
      (d.pairs || []).forEach(p => { if (q.pairs[p.left] && q.pairs[p.left] === p.right) correct++; });
      const bonus = correct === totalPairs ? 3 : 0, total = correct + bonus;
      putSlot(n, slot, { r: 6, idx, pts: total, time: t(d) });
      scores[n] = [correct, bonus, total];
      rows.push({ name: n, pts: total, correct, time: t(d) });
      wb.push({ name: n, slot, data: { correct, bonus, total } });
    });
    rows.sort((a, b) => b.pts !== a.pts ? b.pts - a.pts : a.time - b.time);
    res.scores = scores; res.rows = rows; res.total = totalPairs;
  } else if (round === 8) {
    const total = q.items.length;
    const scores = {}, rows = [];
    names.forEach(n => {
      const d = data[n]; let correct = 0;
      Object.entries(d.assignments || {}).forEach(([item, group]) => { if (q.answers[item] === group) correct++; });
      const bonus = correct === total ? 3 : 0, tot = correct + bonus;
      putSlot(n, slot, { r: 8, idx, pts: tot, time: t(d) });
      scores[n] = [correct, bonus, tot];
      rows.push({ name: n, pts: tot, correct, time: t(d) });
      wb.push({ name: n, slot, data: { correct, bonus, total: tot } });
    });
    rows.sort((a, b) => b.pts !== a.pts ? b.pts - a.pts : a.time - b.time);
    res.scores = scores; res.rows = rows; res.total = total;
  } else if (round === 10) {
    names.forEach(n => {
      const d = data[n]; const ans = Number(d.answer);
      if (!Number.isFinite(ans)) return;
      const diff = Math.abs(ans - Number(q.answer));
      putSlot(n, slot, { r: 10, idx, pts: 0, diff, time: t(d) });
      wb.push({ name: n, slot, data: { diff, correct: Number(q.answer), points: 0, q } });
    });
  }
  if (curQ) curQ.open = false;
  return { res, wb };
}

// ⭐ Кръг 9: точки по подредбата (избиращият ×2 при "Избор 1"), стат. по позиции, класиране по въпроса
function scoreSlot9(slot, q, chooserName, multiplier) {
  const data = watch ? watch.data : {};
  const players = Object.keys(live.players);
  const posCounts = [0, 0, 0, 0, 0]; let answeredCount = 0, notAnswered = 0;
  const rows = [], wb = [];
  const correctNorm = String(q.correct || "").trim();
  players.forEach(n => {
    const d = data[n];
    const ranking = d ? (d.ranking || []) : [];
    let pts = 0;
    if (d) {
      pts = pointsForRanking9(ranking, q.correct);
      if (chooserName && n === chooserName && multiplier === 2) pts *= 2;
      putSlot(n, slot, { r: 9, idx: 0, pts, time: (typeof d.thinkingTime === "number" ? d.thinkingTime : 0) });
      wb.push({ name: n, slot, data: { points: pts, q } });
    }
    if (ranking.length > 0) {
      answeredCount++;
      const pos = ranking.findIndex(a => String(a || "").trim() === correctNorm);
      if (pos >= 0) posCounts[pos]++;
    } else notAnswered++;
    rows.push({ name: n, pts, answered: ranking.length > 0 });
  });
  rows.sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name, "bg"));
  if (curQ) curQ.open = false;
  return { stats: { pos: posCounts, answered: answeredCount, notAnswered }, rows, wb };
}

// ===============================
// ⭐ ДУЗПА ПРИ РАВЕНСТВО
// ===============================
function findTiedGroups(standings, onlyLastPlace, excludeNames) {
  const excl = excludeNames || [];
  const filtered = standings.filter(s => !excl.includes(s.name));
  if (filtered.length < 2) return [];

  if (onlyLastPlace) {
    const lastPts = filtered[filtered.length - 1].points;
    const tied = filtered.filter(s => s.points === lastPts);
    return tied.length > 1 ? [tied.map(s => s.name)] : [];
  }

  const groups = [];
  let i = 0;
  while (i < filtered.length) {
    let j = i;
    while (j + 1 < filtered.length && filtered[j+1].points === filtered[i].points) j++;
    if (j > i) groups.push(filtered.slice(i, j+1).map(s => s.name));
    i = j + 1;
  }
  return groups;
}

// ⭐ Запомняме класирането ТОЧНО както е в момента (без бонуса за жокерите), за да го покажем накрая.
// deltaFn(name) връща { delta } или { tag } — точките от въпроса за този играч.
async function snapshotHiddenStep(ep, title, deltaFn, note) {
  const standings = standingsNow(false);
  const rows = [];
  for (const st of standings) {
    let extra = {};
    try { extra = (await deltaFn(st.name)) || {}; } catch(e) {}
    const row = { name: st.name, points: st.points };
    if (typeof extra.delta === "number") row.delta = extra.delta;
    if (extra.tag) row.tag = extra.tag;
    rows.push(row);
  }
  hiddenSteps.push({ title, rows, note: note || "" });
  log(`🤫 Запазено скрито класиране: ${title}`);
}

// ⭐ Пауза след въпрос — по заявка от админа (games/<GAME>/control/flow { pauseAfterRound })
async function maybePause(ep, afterRound, afterIndex) {
  const ref = doc(db, "games", GAME_ID, "control", "flow");
  let want = false;
  try { const sn = await getDoc(ref); want = sn.exists() && sn.data().pauseAfterRound === true; } catch(e) {}
  if (!want) return;
  log(`⏸ Пауза след кръг ${afterRound}${afterIndex !== undefined ? ", въпрос " + (afterIndex + 1) : ""} (по заявка от админа) — чакам „Продължи“.`);
  await setState(ep, "pause", 6 * 60 * 60 * 1000, { afterRound, afterIndex: afterIndex ?? null });
  while (true) {
    await sleep(2000);
    try { const sn = await getDoc(ref); if (!(sn.exists() && sn.data().pauseAfterRound === true)) break; } catch(e) {}
  }
  log("▶ Продължаваме след паузата.");
}

function pickChooser(standings, excludeNames) {
  const excl = excludeNames || [];
  const eligible = standings.filter(st => !excl.includes(st.name));
  return eligible.length ? eligible[eligible.length - 1].name : null;
}

function nextTiebreakQuestion() {
  if (tiebreakPoolIndex >= questions10.length) {
    log("⚠️ Пулът с въпроси за дузпи при равенство е изчерпан — повтаряме от 4-тия въпрос.");
    tiebreakPoolIndex = R10_RESERVED;
  }
  const q = questions10[tiebreakPoolIndex];
  tiebreakPoolIndex++;
  return q;
}

// ⭐ Решава ВСИЧКИ завързани групи в дадената проверка с ЕДНА обща дузпа (един и същ въпрос
// за всички засегнати). Победител във всяка група +0.1 т., при 3 отбора в група — вторият +0.05 т.
// При пак точно равенство — решава по-бързият отговор (без втора дузпа).
async function runTiebreakIfNeeded(ep, checkpoint, onlyLastPlace, excludeNames, chooserLabel) {
  let standings = standingsNow(false);
  const groups = findTiedGroups(standings, onlyLastPlace, excludeNames);

  if (groups.length === 0) {
    log(`Няма равенства за проверка "${checkpoint}".`);
    return { standings, chooserName: pickChooser(standings, excludeNames), tied: false };
  }

  log(`⚽ Равенство преди ${checkpoint} — групи: ` + groups.map(g => "[" + g.join(", ") + "]").join(" | "));

  const q = nextTiebreakQuestion();
  const slotIdStr = "tb-" + checkpoint;

  watchSlot(slotIdStr, groups.flat());
  // ⚠️ Firestore не поддържа масив в масив — затова всяка група е обект { names: [...] }
  await setState(ep, "tiebreak", TIEBREAK_TIME, { checkpoint, tiedGroups: groups.map(g => ({ names: g })), question: { question: q.question } });
  await sleep(TIEBREAK_TIME + GRACE);

  const data = watch ? watch.data : {};
  const resultGroups = [];
  const wb = [];
  for (const group of groups) {
    const results = group.map(name => {
      const d = data[name];
      if (d && Number.isFinite(Number(d.answer))) {
        return { name, answer: Number(d.answer), diff: Math.abs(Number(d.answer) - Number(q.answer)), time: typeof d.thinkingTime === "number" ? d.thinkingTime : Infinity };
      }
      return { name, answer: null, diff: Infinity, time: Infinity };
    });
    const cmp = (x, y) => x === y ? 0 : (x < y ? -1 : 1);
    results.sort((a, b) => cmp(a.diff, b.diff) || cmp(a.time, b.time));

    const noAnswer = !Number.isFinite(results[0].diff);
    const rowsOut = [];

    if (noAnswer) {
      log(`  → в групата [${group.join(", ")}] никой не отговори — равенството остава (решава се по общото време).`);
      results.forEach(r => rowsOut.push({ name: r.name, answer: null, diff: null, points: 0 }));
    } else {
      for (let k = 0; k < results.length; k++) {
        let pts = 0;
        if (k === 0) pts = 0.1;
        else if (k === 1 && results.length >= 3 && Number.isFinite(results[k].diff)) pts = 0.05;
        if (Number.isFinite(results[k].diff)) {
          putSlot(results[k].name, slotIdStr, { r: "tb", idx: 0, pts, time: 0 });
          wb.push({ name: results[k].name, slot: slotIdStr, data: { points: pts, diff: results[k].diff, q } });
        }
        rowsOut.push({
          name: results[k].name,
          answer: results[k].answer,
          diff: Number.isFinite(results[k].diff) ? results[k].diff : null,
          points: pts
        });
      }
      log(`  → в групата [${group.join(", ")}] печели ${results[0].name}`);
    }
    resultGroups.push({ rows: rowsOut, noAnswer });
  }
  unwatch(true);
  writeBack(wb);

  // ⭐ Класиране СЛЕД дузпата и ясно обявяване кой има правото да избира тема
  standings = standingsNow(false);
  const chooserName = pickChooser(standings, excludeNames);
  log(`👉 ${chooserLabel || "Право на избор има"} ${chooserName || "—"}`);

  await setState(ep, "tiebreak-result", TIEBREAK_REVEAL, {
    checkpoint,
    question: q.question ?? "",
    correctAnswer: q.answer ?? null,
    groups: resultGroups,
    chooserName: chooserName || null,
    chooserLabel: chooserLabel || "Право да избира тема има:"
  });
  await sleep(TIEBREAK_REVEAL);

  return { standings, chooserName, tied: true };
}

// ===============================
// КРЪГОВЕ 1-5, 7 — стандартен цикъл (roundIntro → N × [question→explanation→ranking])
// ===============================
async function runStandardRound(ep, round, questions, Q, EXPL, RANK, introTime) {
  log(`=== Кръг ${round}: обяснение (${introTime/1000} сек.) ===`);
  await setState(ep, "roundIntro", introTime, { round });
  await sleep(introTime);

  for (let i = 0; i < questions.length; i++) {
    log(`Кръг ${round}, въпрос ${i+1}/${questions.length}`);
    const q = questions[i];
    const slot = `r${round}-${i}`;
    watchSlot(slot);
    curQ = { slot, round, q, open: true };

    await setState(ep, "question", Q, { round, index: i, q: pubQ(round, q) });
    await sleep(Q);

    if (round === 2) {
      const usageSnap = await getDoc(doc(db, "games", GAME_ID, "episodes", ep, "jokerUsage", `r2-${i}`));
      const usage = usageSnap.exists() ? usageSnap.data() : {};
      if (usage.majorityUsed || usage.spyUsed) {
        await setState(ep, "jokerBuffer", JOKER_BUFFER2, { round, index: i, q: pubQ(round, q), players: standingsNow(false).map(s => s.name) });
        await sleep(JOKER_BUFFER2);
      }
    }

    await sleep(GRACE);
    const { res, wb } = scoreSlot(round, i, slot, q);
    unwatch(true);
    await setState(ep, "explanation", EXPL, { round, index: i, q: pubQ(round, q), reveal: revealQ(round, q), stats: res.stats });
    writeBack(wb);
    await sleep(EXPL);

    await setState(ep, "ranking", RANK, { round, index: i, isFinal: false, rows: rowsOf(standingsNow(false)) });
    await sleep(RANK);

    // ⭐ пауза по заявка на админа — след всеки въпрос
    await maybePause(ep, round, i);
  }
}

// ===============================
// КРЪГ 6/8 — избор на тема (един играч) + самия кръг
// ===============================
async function runChooseAndRound(ep, round, questions, {
  lobbyTime, chooseTime, revealTime, Q, EXPL, RESULTS, RANK, chooserExcluded, presetChooser
}) {
  log(`=== Кръг ${round}: обяснение (${lobbyTime/1000} сек.) ===`);
  await setState(ep, "roundIntro", lobbyTime, { round });
  await sleep(lobbyTime);

  const standings = standingsNow(false);
  const topics = questions.map(t => t.title);
  const eligible = chooserExcluded ? standings.filter(s => !chooserExcluded.includes(s.name)) : standings;
  // ⭐ Избиращият вече е определен (и обявен) след дузпата — ползваме същия човек, за да няма разминаване
  const chooserName = presetChooser || (eligible.length ? eligible[eligible.length - 1].name : null);
  log(`Кръг ${round} — избиращ (последен в класирането${chooserExcluded ? ", без " + chooserExcluded.join(",") : ""}): ${chooserName || "—"}`);

  const slotId = `r${round}-choice`;
  try { await deleteDoc(doc(db, "games", GAME_ID, "episodes", ep, "choicePicks", slotId)); } catch(e) {}

  const frozen = rowsOf(standings);
  await setState(ep, "choose", chooseTime, { round, slotId, chooserName, frozenRanking: frozen, topics });
  await sleep(chooseTime);

  let chosenTopic = null, autoChosen = false;
  try {
    const snap = await getDoc(doc(db, "games", GAME_ID, "episodes", ep, "choicePicks", slotId));
    if (snap.exists()) chosenTopic = snap.data().topic;
  } catch(e) {}

  if (!chosenTopic || !topics.includes(chosenTopic)) {
    autoChosen = true;
    const seed = hashString(ep + slotId);
    const idx = Math.floor((seed / 233280) * questions.length);
    chosenTopic = questions[idx] ? questions[idx].title : questions[0].title;
    try {
      await setDoc(doc(db, "games", GAME_ID, "episodes", ep, "choicePicks", slotId),
        { topic: chosenTopic, pickedBy: null, autoChosen: true, timestamp: Date.now() }, { merge: true });
    } catch(e) {}
  }
  log(`Кръг ${round} — избрана тема: "${chosenTopic}"${autoChosen ? " (автоматично)" : ""}`);

  await setState(ep, "choose-reveal", revealTime, { round, chosenTopic, chooserName, autoChosen, frozenRanking: frozen, topics });
  await sleep(revealTime);

  const tq = questions.find(t => t.title === chosenTopic) || questions[0];
  const slot = `r${round}-0`;
  watchSlot(slot);
  curQ = { slot, round, q: tq, open: true };
  await setState(ep, "question", Q, { round, index: 0, chosenTopic, q: pubQ(round, tq) });
  await sleep(Q + GRACE);

  const { res, wb } = scoreSlot(round, 0, slot, tq);
  unwatch(true);
  await setState(ep, "explanation", EXPL, { round, index: 0, chosenTopic, q: pubQ(round, tq), reveal: revealQ(round, tq), scores: res.scores });
  writeBack(wb);
  await sleep(EXPL);

  await setState(ep, "q-ranking", RESULTS, { round, index: 0, chosenTopic, rows: res.rows, total: res.total });
  await sleep(RESULTS);

  await setState(ep, "ranking", RANK, { round, index: 0, chosenTopic, isFinal: false, rows: rowsOf(standingsNow(false)) });
  await sleep(RANK);

  return chooserName;
}

// ===============================
// КРЪГ 9 — ИЗБОР (без warmup, от замразеното класиране след кръг 8)
// ===============================
function pickQuestionForArea(area, usedKeys) {
  const candidates = izborPool.filter(q => String(q.area).trim() === area);
  const unused = candidates.filter(q => !usedKeys.has(q.question));
  const chooseFrom = unused.length ? unused : candidates;
  const picked = chooseFrom[0];
  usedKeys.add(picked.question);
  return picked;
}

async function runRound9ChoiceRound(ep, choiceRoundNumber, frozenRanking, usedQuestionKeys, totalSlotsSoFar, totalSlotsOverall) {
  const orderLastToFirst = [...frozenRanking].reverse();
  let topicPool = [...izborAreas];
  let done = totalSlotsSoFar;

  for (const entry of orderLastToFirst) {
    const chooserName = entry.name;
    const slotId = `r9-choice${choiceRoundNumber}-${chooserName}`;

    // ⭐ Последните 2 въпроса на кръг 9: никакво класиране — нито от въпроса, нито временно
    const hidden = (totalSlotsOverall - (done + 1)) < 2;

    // ⭐ Всички теми са изиграни → таблицата се нулира и пак са налични и 30-те
    if (topicPool.length === 0) {
      topicPool = [...izborAreas];
      log("🔄 Кръг 9: всички теми са изиграни — таблицата се нулира.");
    }
    // изигранитете теми се показват бледи и не могат да се избират пак
    const burnedNow = () => izborAreas.filter(t => !topicPool.includes(t));

    // при скрито класиране екранът за избор показва само реда на избиране (без точки)
    const frozenNow = hidden
      ? frozenRanking.map(e => ({ name: e.name }))
      : rowsOf(standingsNow(false));
    await setState(ep, "choose", CHOOSE_TIME9, {
      round: 9, slotId, chooserName,
      roundLabel: `Избор ${choiceRoundNumber}`,
      frozenRanking: frozenNow,
      hidePoints: hidden,
      burnedTopics: burnedNow(),
      topics: izborAreas
    });

    let chosenTopic = null, autoChosen = false;
    const pollStart = Date.now();
    while (Date.now() - pollStart < CHOOSE_TIME9) {
      await sleep(1000);
      try {
        const pickSnap = await getDoc(doc(db, "games", GAME_ID, "episodes", ep, "choicePicks", slotId));
        if (pickSnap.exists()) {
          const t = pickSnap.data().topic;
          if (topicPool.includes(t)) { chosenTopic = t; break; }
          // тема, която вече е изиграна (напр. стар/подправен клиент) — игнорираме я
          try { await deleteDoc(doc(db, "games", GAME_ID, "episodes", ep, "choicePicks", slotId)); } catch(e2) {}
        }
      } catch(e) {}
    }
    if (!chosenTopic) {
      chosenTopic = topicPool[Math.floor(Math.random() * topicPool.length)];
      autoChosen = true;
      try {
        await setDoc(doc(db, "games", GAME_ID, "episodes", ep, "choicePicks", slotId),
          { topic: chosenTopic, pickedBy: "system", timestamp: Date.now() });
      } catch(e) {}
    }
    log(`Кръг 9, Избор ${choiceRoundNumber}: ${chooserName} → ${chosenTopic}${autoChosen ? " (автоматично)" : ""}`);
    topicPool = topicPool.filter(t => t !== chosenTopic);

    await setState(ep, "choose-reveal", CHOOSE_REVEAL9, {
      round: 9, chooserName, roundLabel: `Избор ${choiceRoundNumber}`,
      frozenRanking: frozenNow, chosenTopic, autoChosen, slotId,
      hidePoints: hidden,
      burnedTopics: burnedNow(),
      topics: izborAreas
    });
    await sleep(CHOOSE_REVEAL9);

    const q = pickQuestionForArea(chosenTopic, usedQuestionKeys);
    const multiplier = choiceRoundNumber === 1 ? 2 : 1;
    const excludedPlayer = choiceRoundNumber === 2 ? chooserName : null;
    const roundLabel = choiceRoundNumber === 1
      ? `Кръг 9 — Избор 1 — тема: ${chosenTopic} (×2 точки за ${chooserName})`
      : `Кръг 9 — Избор 2 — тема: ${chosenTopic} (${chooserName} не участва)`;

    const extra = { round: 9, q: pubQ(9, q), slotId, chooserName, chooserMultiplier: multiplier, excludedPlayer, roundLabel };

    watchSlot(slotId);
    curQ = { slot: slotId, round: 9, q, open: true };
    await setState(ep, "question", Q9, extra);
    await sleep(Q9 + GRACE);

    const sc = scoreSlot9(slotId, q, chooserName, multiplier);
    unwatch(true);
    writeBack(sc.wb);

    // ⭐ запазваме скритото класиране за финалното повторение
    if (hidden) {
      const isSecondToLast = (done + 1) === (totalSlotsOverall - 1);
      await snapshotHiddenStep(
        ep,
        isSecondToLast ? "Класиране след предпоследния въпрос (Кръг 9)" : "Класиране след последния въпрос (Кръг 9)",
        async (name) => {
          if (name === excludedPlayer) return { tag: "не участва в този въпрос" };
          const s = ledger[name] && ledger[name].slots[slotId];
          return s ? { delta: s.pts || 0 } : { tag: "не е отговорил на този въпрос" };
        }
      );
    }

    await setState(ep, "explanation", EXPL9, { ...extra, reveal: revealQ(9, q), stats: sc.stats });
    await sleep(EXPL9);

    // класиране по въпроса — само докато не сме в последните 2 въпроса
    if (!hidden) {
      await setState(ep, "q-ranking", QRANK9, { round: 9, slotId, rows: sc.rows });
      await sleep(QRANK9);
    }

    done++;
    await setState(ep, "ranking", RANK9, { round: 9, isFinal: false, hideRanking: hidden, rows: hidden ? [] : rowsOf(standingsNow(false)) });
    await sleep(RANK9);

    // ⭐ пауза по заявка на админа — след всеки въпрос
    await maybePause(ep, 9, done - 1);
  }

  return done;
}

async function runRound9(ep, frozenRankingAfter8) {
  log(`=== Кръг 9: обяснение (${LOBBY_TIME9/1000} сек.) ===`);
  await setState(ep, "roundIntro", LOBBY_TIME9, { round: 9 });
  await sleep(LOBBY_TIME9);

  const usedQuestionKeys = new Set();
  const playerCount = frozenRankingAfter8.length;
  const totalSlotsOverall = playerCount * 2;

  log("=== Кръг 9 — Избор 1 (×2 за избиращия), отзад напред ===");
  let done = await runRound9ChoiceRound(ep, 1, frozenRankingAfter8, usedQuestionKeys, 0, totalSlotsOverall);

  log("=== Кръг 9 — Избор 2 (избиращият не участва), отзад напред ===");
  await runRound9ChoiceRound(ep, 2, frozenRankingAfter8, usedQuestionKeys, done, totalSlotsOverall);
}

// ===============================
// КРЪГ 10 — 3 ДУЗПИ (от общия пул questions10.json, последователно)
// ===============================
async function runRound10(ep) {
  log(`=== Кръг 10: обяснение (${LOBBY_TIME10/1000} сек.) ===`);
  await setState(ep, "roundIntro", LOBBY_TIME10, { round: 10 });
  await sleep(LOBBY_TIME10);

  for (let tier = 0; tier < 3; tier++) {
    const q = questions10[tier];   // ⭐ винаги първите 3 въпроса от файла, по ред
    log(`Кръг 10, дузпа ${tier+1}/3`);
    const slot = `r10-${tier}`;
    watchSlot(slot);
    curQ = { slot, round: 10, q, open: true };

    await setState(ep, "question", Q10, { round: 10, index: tier, tier, q: pubQ(10, q) });
    await sleep(Q10 + GRACE);

    const { wb } = scoreSlot(10, tier, slot, q);
    unwatch(true);
    writeBack(wb);

    // ⭐ запазваме класирането след дузпата, но НЕ го показваме сега
    const diffs = [];
    Object.values(ledger).forEach(L => { const s = L.slots[slot]; if (s && typeof s.diff === "number") diffs.push(s.diff); });
    await snapshotHiddenStep(
      ep,
      `Класиране след дузпа ${tier + 1} от 3 (Кръг 10)`,
      async (name) => {
        const s = ledger[name] && ledger[name].slots[slot];
        return s ? { delta: calcPoints10(tier, diffs, s.diff) } : { tag: "не е отговорил на тази дузпа" };
      },
      tier === 2 ? "Това е класирането преди добавянето на бонуса за неизползвани жокери." : ""
    );

    await setState(ep, "explanation", EXPL10, { round: 10, index: tier, tier, q: pubQ(10, q), reveal: revealQ(10, q) });
    await sleep(EXPL10);

    await setState(ep, "ranking", RANK10, { round: 10, isFinal: false, hideRanking: true, rows: [] });
    await sleep(RANK10);

    if (tier < 2) await maybePause(ep, 10, tier);
  }
}

// ===============================
// ⭐ БЛАГОДАРНОСТИ + ДРАМАТИЧНО ФИНАЛНО КЛАСИРАНЕ
// ===============================
async function runThanksAndFinalReveal(ep) {
  await setState(ep, "thanks", THANKS_TIME, {});
  await sleep(THANKS_TIME);

  const standings = standingsNow(true);
  const rows = rowsOf(standings, true);
  const total = standings.length;

  log("Разкриваме класирането отзад напред...");
  for (let revealed = 1; revealed <= total; revealed++) {
    await setState(ep, "final-reveal", REVEAL_STEP_TIME, { revealedCount: revealed, rows });
    await sleep(REVEAL_STEP_TIME);
  }

  await setState(ep, "final-reveal", REVEAL_SETTLE_TIME, { revealedCount: total, rows });
  await sleep(REVEAL_SETTLE_TIME);

  // ⭐ Едва сега показваме скритите класирания — как се е стигнало до крайния резултат
  log(`Показваме скритите класирания (${hiddenSteps.length} стъпки)...`);
  for (const step of hiddenSteps) {
    await setState(ep, "replay", REPLAY_STEP_TIME, { title: step.title, rows: step.rows, note: step.note });
    await sleep(REPLAY_STEP_TIME);
  }

  log("Играта приключи — крайно класиране (остава завинаги).");
  await setState(ep, "finalRanking", FINAL_RANK_TIME, { isFinal: true, rows });
}

// ===============================
// ОБЩА ПОСЛЕДОВАТЕЛНОСТ
// ===============================
async function runGame(ep, start = 1) {
  await loadAllQuestions();
  await startLive(ep, true);   // книгата с точките се възстановява от записаното (важно при „старт от кръг X“)
  const go = n => start <= n;
  if (start > 1) log(`▶ Продължаваме от кръг ${start} (резултатите от по-ранните кръгове се запазват).`);

  if (go(1)) { await runStandardRound(ep, 1, questions1, Q1, EXPL1, RANK1, LOBBY_TIME1); }
  if (go(2)) { await runStandardRound(ep, 2, questions2, Q2, EXPL2, RANK2, LOBBY_TIME2); }
  if (go(3)) { await runStandardRound(ep, 3, questions3, Q3, EXPL3, RANK3, LOBBY_TIME3); }
  if (go(4)) {
    await runStandardRound(ep, 4, questions4, Q4, EXPL4, RANK4, LOBBY_TIME4);
    log("☕ Почивка (5 мин.)...");
    await setState(ep, "break", BREAK_TIME, {});
    await sleep(BREAK_TIME);
  }

  if (go(5)) { await runStandardRound(ep, 5, questions5, Q5, EXPL5, RANK5, LOBBY_TIME5); }

  let r6Chooser = null;
  if (go(6)) {
    // ⭐ Дузпа при равенство на ПОСЛЕДНОТО място преди избора в кръг 6
    const tb5 = await runTiebreakIfNeeded(ep, "r5", true, [], "Право да избере тема за Кръг 6 има:");
    r6Chooser = await runChooseAndRound(ep, 6, questions6, {
      lobbyTime: LOBBY_TIME6, chooseTime: CHOOSE_TIME6, revealTime: CHOOSE_REVEAL6, Q: Q6,
      EXPL: EXPL6, RESULTS: RESULTS6, RANK: RANK6,
      chooserExcluded: [], presetChooser: tb5.chooserName
    });
    try {
      await setDoc(doc(db, "games", GAME_ID, "episodes", ep, "meta", "r6chooser"), { name: r6Chooser });
    } catch(e) {}
    await maybePause(ep, 6);
  } else {
    try {
      const sn = await getDoc(doc(db, "games", GAME_ID, "episodes", ep, "meta", "r6chooser"));
      if (sn.exists()) r6Chooser = sn.data().name || null;
    } catch(e) {}
    log(`Избирал в кръг 6 (от записа): ${r6Chooser || "—"}`);
  }

  if (go(7)) { await runStandardRound(ep, 7, questions7, Q7, EXPL7, RANK7, LOBBY_TIME7); }

  if (go(8)) {
    // ⭐ Дузпа при равенство на ПОСЛЕДНОТО (допустимо) място преди избора в кръг 8 —
    // изключваме вече избиралия в кръг 6.
    const tb7 = await runTiebreakIfNeeded(ep, "r7", true, r6Chooser ? [r6Chooser] : [], "Право да избере тема за Кръг 8 има:");
    await runChooseAndRound(ep, 8, questions8, {
      lobbyTime: LOBBY_TIME8, chooseTime: CHOOSE_TIME8, revealTime: CHOOSE_REVEAL8, Q: Q8,
      EXPL: EXPL8, RESULTS: RESULTS8, RANK: RANK8,
      chooserExcluded: r6Chooser ? [r6Chooser] : [], presetChooser: tb7.chooserName
    });
    await maybePause(ep, 8);

    log("☕ Почивка (5 мин.)...");
    await setState(ep, "break", BREAK_TIME, {});
    await sleep(BREAK_TIME);
  }

  if (go(9)) {
    // ⭐ Пълно разчистване на равенства (навсякъде в класирането) — нужно за реда на избор в кръг 9
    const tb8 = await runTiebreakIfNeeded(ep, "r8", false, [], "Първи избира тема в Кръг 9 (последен в класирането):");
    await runRound9(ep, tb8.standings);
  }

  if (go(10)) await runRound10(ep);
  if (start > 9) log("ℹ️ Скритите класирания от кръг 9 не са налични при продължаване от кръг 10.");

  await runThanksAndFinalReveal(ep);

  log("🏁 Играта приключи напълно.");
}

      const row = document.createElement("div");
      row.style.cssText = "display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.12);";
      row.innerHTML = `<span style="width:28px; opacity:.7;">${i + 1}.</span><span style="flex:1; word-break:break-word;">${adminEsc(p.name)}</span>
        <span class="pts" style="min-width:64px; text-align:right;"><b>${adminFmt(p.points)}</b></span>
        <span class="adj" style="min-width:56px; opacity:.7; text-align:right;">${adminAdj[p.name] ? "(" + (adminAdj[p.name] > 0 ? "+" : "") + adminFmt(adminAdj[p.name]) + ")" : ""}</span>
        <button class="m" style="margin:0; padding:4px 14px; font-size:1.1em;">−</button><button class="p" style="margin:0; padding:4px 14px; font-size:1.1em;">+</button>`;
      let pts = p.points;
      const change = async sign => {
        const step = Number(document.getElementById("adStep").value) || 0;
        if (!step) return;
        const next = Math.round(((adminAdj[p.name] || 0) + sign * step) * 10000) / 10000;
        try {
          await setDoc(doc(db, "games", GAME_ID, "episodes", ep, "adjustments", p.name), { delta: next, updatedAt: Date.now() }, { merge: true });
          adminAdj[p.name] = next;
          pts = Math.round((pts + sign * step) * 10000) / 10000;
          row.querySelector(".pts").innerHTML = `<b>${adminFmt(pts)}</b>`;
          row.querySelector(".adj").textContent = next ? "(" + (next > 0 ? "+" : "") + adminFmt(next) + ")" : "";
          log(`✏️ Корекция: ${p.name} ${sign > 0 ? "+" : "−"}${adminFmt(step)} (общо корекция ${adminFmt(next)})`);
        } catch (e) { alert("Не успях да запиша: " + e.message); }
      };
      row.querySelector(".m").onclick = () => change(-1);
      row.querySelector(".p").onclick = () => change(+1);
      list.appendChild(row);
    });
  } catch (e) { list.textContent = "Грешка: " + (e && e.message ? e.message : e); }
}


document.getElementById("folderBtn").onclick = pickFolder;
document.getElementById("folderReloadBtn").onclick = reloadLastFolder;
document.getElementById("folderInput").onchange = async e => { const fs = [...e.target.files]; const lbl = fs[0] && fs[0].webkitRelativePath ? fs[0].webkitRelativePath.split("/")[0] : ""; await ingestFiles(fs, lbl); e.target.value = ""; };
document.getElementById("filesLink").onclick = e => { e.preventDefault(); document.getElementById("filesInput").click(); };
document.getElementById("filesInput").onchange = async e => { await ingestFiles([...e.target.files], "избрани файлове"); e.target.value = ""; };
updateFolderStatus();

document.getElementById("startBtn").onclick = async () => {
  const ep = document.getElementById("ep").value.trim();
  const startTimeRaw = document.getElementById("startTime").value;
  const startRound = Number(document.getElementById("startRound").value) || 1;

  if (!ep) return alert("Въведи име на епизод!");
  if (!folderReady()) return alert("Първо избери папката с въпросите (бутон „Избери папка с въпроси“).");

  // ⭐ Продължаване от кръг X — без лоби и престарт, започваме веднага
  if (startRound > 1) {
    if (!confirm(`Да продължа епизод "${ep}" от кръг ${startRound}? (резултатите се запазват)`)) return;
    document.getElementById("startBtn").disabled = true;
    document.getElementById("startBtn").textContent = "Играта тече…";
    try { await setDoc(doc(db, "games", GAME_ID, "control", "flow"), { pauseAfterRound: false }, { merge: true }); } catch(e) {}
    try {
      await runGame(ep, startRound);
    } catch (err) {
      log("❌ ГРЕШКА — играта спря: " + (err && err.message ? err.message : err));
      console.error(err);
    }
    return;
  }

  if (!startTimeRaw) return alert("Избери час за старт!");

  const [hh, mm] = startTimeRaw.split(":").map(Number);
  const now = new Date();
  let startAt = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0).getTime();
  if (startAt <= Date.now()) startAt += 24 * 60 * 60 * 1000;

  const prestartDuration = startAt - Date.now() - LOBBY_TIME;
  if (prestartDuration < 0) return alert("Избраният час е твърде близо! Избери по-късен час.");

  document.getElementById("startBtn").disabled = true;
  document.getElementById("startBtn").textContent = "Играта тече…";

  await resetState();
  try { await setDoc(doc(db, "games", GAME_ID, "control", "flow"), { pauseAfterRound: false }, { merge: true }); } catch(e) {}
  await setState(ep, "lobby", LOBBY_TIME, {});
  log(`Лоби (10 сек.) → престарт → старт в ${startTimeRaw}`);

  await sleep(LOBBY_TIME);
  await setState(ep, "prestart", prestartDuration, {});
  await sleep(prestartDuration);

  log("Играта започва!");
  try {
    await runGame(ep, 1);
  } catch (err) {
    log("❌ ГРЕШКА — играта спря: " + (err && err.message ? err.message : err));
    console.error(err);
  }
};
</script>
